binary_sensor:
  - platform: status
    name: "Node Status"
    id: system_status
    entity_category: "diagnostic"

sensor:
  - platform: uptime
    name: "Uptime"
    id: sys_uptime
    entity_category: "diagnostic"
    update_interval: 60s