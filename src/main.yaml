
# https://github.com/alaltitov/Guition-ESP32-S3-4848S040

# https://github.com/alaltitov/Guition-ESP32-S3-4848S040-DOCS

# En HACS: https://github.com/alaltitov/homeassistant-display-tools/blob/main/info.md

# NAMES
substitutions:
  display_name:             display01
  display_friendly_name:    Display Petin1

packages:
  common_substitutions: !include common/substitutions.yaml
  event_bus: !include common/event_bus.yaml

  # Add here the hiding of elements when a page becomes not visible
  page_manager: !include common/page_manager.yaml
  home: !include widgets/home/home.yaml

 # <================================== Cambiar
  vacuum: !include widgets/vacuum/vacuum.yaml
  info: !include widgets/info/info.yaml
  texto: !include widgets/texto/texto.yaml
  locks: !include widgets/locks/locks.yaml
  doors: !include widgets/doors/doors.yaml
  gate: !include widgets/gate/gate.yaml
  thermostat: !include widgets/thermostat/thermostat.yaml
  cover: !include widgets/cover/cover.yaml
  fan: !include widgets/fan/fan.yaml
  media_player: !include widgets/media_player/media_player.yaml

  # boiler: !include widgets/boiler/config.yaml
  # alarm_panel: !include widgets/alarm_panel/config.yaml
  # <==================================

  loading_page: !include common/widgets/loading.yaml

  devices: !include common/widgets/devices.yaml

  light: !include widgets/light/light_generated.yaml

#substitutions: !include common/substitutions.yaml
image: !include common/image.yaml
font: !include common/fonts.yaml
color: !include common/colors.yaml

http_request:
  verify_ssl: false

external_components:
  - source: github://alaltitov/esphome@dev
    components: [i18n]

i18n:
  id: i18n_translations
  sources:
    - translations/en.yaml
    - translations/es.yaml
    - translations/de.yaml
#    - translations/fr.yaml
#    - translations/nl.yaml
#    - translations/pl.yaml
#    - translations/ru.yaml
#    - translations/si.yaml
#    - translations/it.yaml
  default_locale: en

esphome:
  name: ${display_name}
  friendly_name: ${display_friendly_name}
  includes:
    - <sstream>
    - <algorithm>
  platformio_options:
    board_build.flash_mode: dio
#    build_flags:
#      - -DUSE_LVGL_FONT
  on_boot:
    - priority: 400
      then:
        - lambda: |-
            id(i18n_translations).set_current_locale(id(current_language));
        - script.execute: update_loading_page
    - priority: -100
      then:
        - lvgl.roller.update:
            id: backlight_settings_sleep_time_roller
            selected_index: !lambda return id(display_timeout);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      # CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      # CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      # CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # CONFIG_ESP_MAIN_TASK_STACK_SIZE: "131072"
      # CONFIG_ESP_MAIN_TASK_STACK_SIZE: "65536"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      # CONFIG_FREERTOS_USE_TRACE_FACILITY: "y"
      # CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS: "y"
      # CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: "y"
      # CONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER: "y"

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: ${log_level}
  #baud_rate: 0
  logs:
    lvgl: ${log_level} #INFO
    wifi: ${log_level} #INFO
    sensor: ${log_level} #INFO
    component: ${log_level} #WARN   # Avoid spam from internal components
  hardware_uart: UART0

api:
  encryption:
    key: !secret display1_key

ota:
  - platform: esphome
    id: ota_state
    password: !secret display_ota
    on_begin:
      - logger.log: "OTA Start"
      - lvgl.resume:
      - lvgl.widget.redraw:
      - lvgl.label.update:
          id: ota_label_primary
          text: !lambda |-
            return id(i18n_translations).translate("ota.start.primary");
      - lvgl.label.update:
          id: ota_label_secondary
          text: !lambda |-
            return id(i18n_translations).translate("ota.start.secondary");

      - lvgl.widget.show: ota_widget

      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lambda: "id(display_backlight).loop();"
      - delay: 10s

      - lvgl.widget.redraw:
      - lambda: "id(lvgl_component).loop();"
      - lambda: "id(lvgl_component).loop();"

      - logger.log: "OTA widget shown"

    on_progress:
      - lvgl.bar.update:
          id: ota_bar_value
          value: !lambda return (int)x;
      - lvgl.label.update:
          id: ota_label_primary
          text: " "
      - lvgl.label.update:
          id: ota_label_secondary
          text: !lambda |-
            static char buffer[64];
            snprintf(buffer, sizeof(buffer), id(i18n_translations).translate("ota.progress").c_str(), x);
            return buffer;
      - lambda: "id(lvgl_component).loop();"

    on_end:
      - logger.log: "OTA End"
      - lvgl.bar.update:
          id: ota_bar_value
          value: 100
      - lvgl.label.update:
          id: ota_label_primary
          text: !lambda |-
            return id(i18n_translations).translate("ota.end.primary");
      - lvgl.label.update:
          id: ota_label_secondary
          text: !lambda |-
            return id(i18n_translations).translate("ota.end.secondary");
      - lambda: |-
          id(lvgl_component).loop();

    on_error:
      - logger.log:
            format: "OTA update error %d"
            args: ["x"]
      - lvgl.label.update:
          id: ota_label_primary
          text: !lambda |-
            return id(i18n_translations).translate("ota.error.primary");
      - lvgl.label.update:
          id: ota_label_secondary
          text: !lambda |-
            return id(i18n_translations).translate("ota.error.secondary");
      - lambda: |-
          id(lvgl_component).loop();

wifi:
  networks:
   - ssid: $wifi_ssid1
     password: $wifi_password1
   - ssid: $wifi_ssid2
     password: $wifi_password2
  on_connect:
    - lvgl.label.update:
        id: wifi_status
        text_color: color_green

  on_disconnect:
    - lvgl.label.update:
        id: wifi_status
        text_color: color_steel_blue

lvgl:
  id: lvgl_component
  color_depth: 16
  byte_order: big_endian
  displays: ${display_name}
  touchscreens:
    - touchscreen_id: touchscreen_id
      long_press_time: 5000ms
      long_press_repeat_time: 400ms
  page_wrap: false
  top_layer:
    widgets:
      - obj:
          id: ota_widget
          hidden: true
          width: 480
          height: 480
          align: center
          clickable: false
          bg_color: color_slate_blue_gray
          border_opa: transp
          shadow_opa: transp
          radius: 0
          widgets:
            - label:
                id: ota_label_primary
                y: -50
                align: center
                text_font: nunito_20
                text_color: color_misty_blue
                text: "Starting OTA!"
            - label:
                id: ota_label_secondary
                y: -20
                align: center
                text_font: nunito_18
                text_color: color_misty_blue
                text: "Wait..."
            - bar:
                id: ota_bar_value
                y: 20
                width: 300
                value: 0
                align: center
                min_value: 0
                max_value: 100
                animated: true
                bg_color: color_steel_blue
                indicator:
                  bg_color: color_misty_blue

light:
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    on_turn_on:
      - lambda: |-
          ESP_LOGI("backlight", "Brightness requested: %.0f%%", id(display_backlight).remote_values.get_brightness() * 100);
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming by backlight on"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - logger.log: "LVGL is idle - activating screensaver"
            # Activar el salvapantallas
            - script.execute: activate_screensaver
            # Reducir brillo
            - light.turn_on:
                id: display_backlight
                brightness: 50%  # Brillo bajo para el salvapantallas
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(display_timeout_backlight).state >= 0;'
          then:
            - logger.log: "Backlight off, pausing LVGL"
            - script.execute: pause_lvgl_display

output:
    # Backlight LED
  - platform: ledc
    pin: GPIO38
    id: backlight_output
    frequency: 100Hz

i2c:
  - id: bus_a
    sda: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true
    frequency: 100kHz

touchscreen:
  platform: gt911
  id: touchscreen_id
  transform:
    mirror_x: false
    mirror_y: false
  display: ${display_name}
  on_release:
    - if:
        condition: lvgl.is_paused
        then:
          - logger.log: "LVGL resuming"
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: display_backlight
        else:
          - if:
              condition:
                lambda: 'return id(active_lvgl_page) == "screensaver_page";'
              then:
                - script.execute: exit_screensaver
              else:
                - light.turn_on:
                    id: display_backlight
                    brightness: 100%

  # on_touch:
  #   - lambda: |-
  #         ESP_LOGD("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
  #             touch.x,
  #             touch.y,
  #             touch.x_raw,
  #             touch.y_raw
  #             );

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

display:
  - platform: st7701s
    id: ${display_name}
    update_interval: never
    auto_clear_enabled: false
    data_rate: 2MHz
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    transform:
      mirror_x: false
      mirror_y: false
    cs_pin: 39
      # reset not defined
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    pclk_frequency: 12MHz
    pclk_inverted: false
    data_pins:
      red:
        - 11         # R1
        - 12         # R2
        - 13         # R3
        - 14         # R4
        - 0          # R5
      green:
        - 8          # G0
        - 20         # G1
        - 3          # G2
        - 46         # G3
        - 9          # G4
        - 10         # G5
      blue:
        - 4          # B1
        - 5          # B2
        - 6          # B3
        - 7          # B4
        - 15         # B5

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      # Restart every day at 3:00 AM
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - logger.log:
              level: INFO
              tag: "restart"
              format: "Daily restart at 3:00 AM"
          - delay: 1s
          - button.press: restart_button

button:
  - platform: restart
    name: "Reboot"
    id: restart_button

