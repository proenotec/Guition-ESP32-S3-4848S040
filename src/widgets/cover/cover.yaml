                      on_press:
                        - script.execute:
                            id: cycle_cover
                            position: 6


  pages:
    - id: cover_page
      bg_color: color_black
      scrollable: false
      on_load:
        # ✅ Método centralizado
        - script.execute:
            id: set_active_page
            page_name: "cover_page"
        - lambda: |-
            int covers = ${covers_amount};
            if (covers >= 2) {
              lv_obj_clear_flag(id(cover_select_widget), LV_OBJ_FLAG_HIDDEN);
            }
        - script.execute:
            id: cycle_cover
            position: 1
      widgets:
        - label:
            id: cover_name_label
            y: 20
            align: top_mid
            text_font: nunito_20
            text_color: color_misty_blue
            text: "---"
        - obj:
            id: cover_widget_background
            hidden: false
            y: 70
            width: 440
            height: 130
            align: top_mid
            clickable: false
            scrollable: false
            radius: 20
            pad_all: 0
            bg_color: color_slate_blue_gray
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            widgets:
              # ICON
              - obj:
                  id: cover_icon_bg
                  x: 20
                  width: 80
                  height: 80
                  align: left_mid
                  bg_color: color_misty_blue
                  bg_opa: 20%
                  border_opa: transp
                  shadow_opa: transp
                  radius: 60
                  widgets:
                    - label:
                        id: cover_icon
                        align: center
                        text_font: mdi_icons_40
                        text_color: color_misty_blue
                        text: " "

              # STATE/POSITION INFO
              - obj:
                  width: 300
                  height: 120
                  align: right_mid
                  bg_color: color_steel_blue
                  bg_opa: transp
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  radius: 10
                  widgets:
                    - label:
                        id: cover_state_label
                        height: 40
                        width: 260
                        long_mode: DOT
                        y: 5
                        align: CENTER
                        text_color: color_misty_blue
                        text_font: nunito_20
                        text: "Open"
                    - label:
                        id: cover_pos_label
                        height: 30
                        width: 260
                        y: 20
                        align: CENTER
                        text_color: color_misty_blue
                        text_font: nunito_16
                        text: " "

        # CONTROL BUTTONS
        - obj:
            id: cover_controls_background
            y: 210
            width: 440
            height: 100
            align: top_mid
            clickable: false
            scrollable: false
            radius: 20
            pad_all: 0
            bg_color: color_slate_blue_gray
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            widgets:
              - obj:
                  width: 440
                  height: 100
                  align: center
                  clickable: false
                  scrollable: false
                  radius: 20
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  widgets:
                    # OPEN BUTTON
                    - obj:
                        x: 30
                        width: 90
                        height: 90
                        align: left_mid
                        pad_all: 0
                        bg_opa: transp
                        shadow_opa: transp
                        border_opa: transp
                        widgets:
                          - button:
                              width: 70
                              height: 70
                              align: center
                              clickable: true
                              radius: 50
                              pad_all: 0
                              bg_opa: transp
                              border_opa: transp
                              border_width: 0
                              shadow_width: 8
                              shadow_spread: 2
                              shadow_ofs_y: 0
                              shadow_color: color_black
                              shadow_opa: cover
                              pressed:
                                bg_color: color_steel_blue
                                shadow_width: 4
                              on_press:
                                - homeassistant.action:
                                    action: cover.open_cover
                                    data:
                                      entity_id: !lambda 'return id(current_cover_entity);'

                          - obj:
                              width: 60
                              height: 60
                              align: center
                              clickable: false
                              radius: 45
                              pad_all: 0
                              bg_opa: transp
                              border_opa: transp
                              shadow_width: 4
                              shadow_color: 0xFFFFFF
                              shadow_ofs_x: -4
                              shadow_ofs_y: -2
                              shadow_opa: 30%

                          - obj:
                              width: 65
                              height: 65
                              pad_all: 0
                              align: center
                              clickable: false
                              radius: 50
                              border_opa: transp
                              bg_color: color_slate_blue_gray
                              widgets:
                                - label:
                                    align: center
                                    text_font: mdi_icons_40
                                    text_color: color_misty_blue
                                    text: "${arrow_up_icon}"

                    # CLOSE BUTTON
                    - obj:
                        x: -30
                        width: 90
                        height: 90
                        align: right_mid
                        pad_all: 0
                        bg_opa: transp
                        shadow_opa: transp
                        border_opa: transp
                        widgets:
                          - button:
                              width: 70
                              height: 70
                              align: center
                              clickable: true
                              radius: 50
                              pad_all: 0
                              bg_opa: transp
                              border_opa: transp
                              border_width: 0
                              shadow_width: 8
                              shadow_spread: 2
                              shadow_ofs_y: 0
                              shadow_color: color_black
                              shadow_opa: cover
                              pressed:
                                bg_color: color_steel_blue
                                shadow_width: 4
                              on_press:
                                - homeassistant.action:
                                    action: cover.close_cover
                                    data:
                                      entity_id: !lambda 'return id(current_cover_entity);'

                          - obj:
                              width: 60
                              height: 60
                              align: center
                              clickable: false
                              radius: 45
                              pad_all: 0
                              bg_opa: transp
                              border_opa: transp
                              shadow_width: 4
                              shadow_color: 0xFFFFFF
                              shadow_ofs_x: -4
                              shadow_ofs_y: -2
                              shadow_opa: 30%

                          - obj:
                              width: 65
                              height: 65
                              pad_all: 0
                              align: center
                              clickable: false
                              radius: 50
                              border_opa: transp
                              bg_color: color_slate_blue_gray
                              widgets:
                                - label:
                                    align: center
                                    text_font: mdi_icons_40
                                    text_color: color_misty_blue
                                    text: "${arrow_down_icon}"

        # FOOTER COVER BACKGROUND
        - obj:
            x: 0
            y: -60
            width: 440
            height: 100
            pad_all: 0
            align: bottom_mid
            bg_color: color_slate_blue_gray
            shadow_opa: transp
            border_opa: transp
            border_width: 0
            radius: 20

        # CIRCLE
        - obj:
            id: cover_circle_background
            y: 20
            width: 150
            height: 150
            align: center
            clickable: false
            radius: 75
            pad_all: 0
            bg_color: color_black
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            widgets:
              - obj:
                  width: 100
                  height: 100
                  pad_all: 0
                  align: center
                  clickable: false
                  radius: 50
                  border_opa: transp
                  bg_color: color_slate_blue_gray

              - obj:
                  width: 150
                  height: 150
                  align: center
                  clickable: false
                  radius: 75
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  widgets:
                    - arc:
                        clickable: false
                        adjustable: false
                        adv_hittest: false
                        align: center
                        width: 130
                        height: 130
                        min_value: 0
                        max_value: 100
                        start_angle: 0
                        end_angle: 360
                        rotation: 0
                        arc_width: 5
                        arc_color: color_steel_blue
                        arc_rounded: false
                        indicator:
                          arc_width: 5
                          arc_opa: transp
                        knob:
                          bg_opa: transp
                    - arc:
                        id: cover_position_arc
                        clickable: false
                        adjustable: true
                        adv_hittest: true
                        align: center
                        width: 130
                        height: 130
                        min_value: 0
                        max_value: 100
                        start_angle: 0
                        end_angle: 270
                        rotation: 135
                        arc_width: 5
                        arc_color: color_steel_blue
                        arc_rounded: false
                        indicator:
                          arc_width: 5
                          arc_color: color_steel_blue
                        knob:
                          bg_opa: transp

                        on_release:
                          - homeassistant.action:
                              action: cover.set_cover_position
                              data:
                                entity_id: !lambda 'return id(current_cover_entity);'
                                position: !lambda return int(x);

                    - obj:
                        width: 100
                        height: 100
                        pad_all: 0
                        align: center
                        clickable: false
                        radius: 50
                        border_opa: transp
                        bg_opa: transp
                        widgets:
                          - label:
                              id: cover_stop_icon
                              align: CENTER
                              text_color: color_misty_blue
                              text_font: mdi_icons_52
                              text: "${stop_icon}"
                              on_press:
                                - homeassistant.action:
                                    action: cover.stop_cover
                                    data:
                                      entity_id: !lambda 'return id(current_cover_entity);'

        # back
        - obj:
            y: 0
            width: 80
            height: 70
            align: bottom_mid
            bg_opa: transp
            pad_all: 0
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 0
            widgets:
              - obj:
                  y: -20
                  width: 80
                  height: 5
                  align: bottom_mid
                  bg_color: color_steel_blue
                  pad_all: 0
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  radius: 15
            on_click:
              - lvgl.widget.hide: cover_select_widget
              - script.execute:
                  id: page_cleanup
                  page_name: "cover_page"
              - lvgl.page.show: home_page

script:
  # Cycle cover (similar to thermostat)
  - id: cycle_cover
    parameters:
      position: int
    then:
      - lambda: |-
          const char* entities[] = {"${cover_entity_1}", "${cover_entity_2}", "${cover_entity_3}", "${cover_entity_4}", "${cover_entity_5}", "${cover_entity_6}"};
          const int num = ${covers_amount};
          if (position > 0 && position <= num) {
            id(current_cover_index) = position;
            id(current_cover_entity) = entities[position - 1];

            // Update friendly name label from stored globals
            std::string name = "";
            switch (position) {
              case 1: name = id(cover_name_1_stored); break;
              case 2: name = id(cover_name_2_stored); break;
              case 3: name = id(cover_name_3_stored); break;
              case 4: name = id(cover_name_4_stored); break;
              case 5: name = id(cover_name_5_stored); break;
              case 6: name = id(cover_name_6_stored); break;
              default: name = "Cover";
            }
            if (!name.empty()) {
              lv_label_set_text(id(cover_name_label), name.c_str());
            }
            ESP_LOGI("cover_cycle", "Switched to: %s (%s)", name.c_str(), entities[position - 1]);

            // Reset all button backgrounds to transparent
            lv_obj_set_style_bg_opa(id(cover_btn_1), LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(id(cover_btn_2), LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(id(cover_btn_3), LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(id(cover_btn_4), LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(id(cover_btn_5), LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(id(cover_btn_6), LV_OPA_TRANSP, 0);

            // Reset all icon colors to misty_blue
            lv_obj_set_style_text_color(id(cover_icon_1), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(cover_icon_2), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(cover_icon_3), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(cover_icon_4), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(cover_icon_5), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(cover_icon_6), color_misty_blue, 0);

            // Highlight the selected button
            switch (position) {
              case 1:
                lv_obj_set_style_bg_opa(id(cover_btn_1), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(cover_btn_1), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(cover_icon_1), color_white, 0);
                break;
              case 2:
                lv_obj_set_style_bg_opa(id(cover_btn_2), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(cover_btn_2), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(cover_icon_2), color_white, 0);
                break;
              case 3:
                lv_obj_set_style_bg_opa(id(cover_btn_3), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(cover_btn_3), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(cover_icon_3), color_white, 0);
                break;
              case 4:
                lv_obj_set_style_bg_opa(id(cover_btn_4), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(cover_btn_4), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(cover_icon_4), color_white, 0);
                break;
              case 5:
                lv_obj_set_style_bg_opa(id(cover_btn_5), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(cover_btn_5), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(cover_icon_5), color_white, 0);
                break;
              case 6:
                lv_obj_set_style_bg_opa(id(cover_btn_6), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(cover_btn_6), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(cover_icon_6), color_white, 0);
                break;
            }
          }
      - script.execute: cover_cycle_refresh

  - id: cover_cycle_refresh
    then:
      - delay: 500ms
      - lambda: |-
          int idx = id(current_cover_index);
          ESP_LOGI("CYCLE_REFRESH", "Manually publishing templates for index %d", idx);

          // Current position
          {
            optional<float> val;
            switch (idx) {
              case 1: val = id(cover_current_pos_sensor_1).state; break;
              case 2: val = id(cover_current_pos_sensor_2).state; break;
              case 3: val = id(cover_current_pos_sensor_3).state; break;
              case 4: val = id(cover_current_pos_sensor_4).state; break;
              case 5: val = id(cover_current_pos_sensor_5).state; break;
              case 6: val = id(cover_current_pos_sensor_6).state; break;
            }
            if (val.has_value()) {
              id(cover_current_pos_sensor).publish_state(val.value());
            }
          }

          // State
          {
            std::string val;
            switch (idx) {
              case 1: val = id(cover_state_sensor_1).state; break;
              case 2: val = id(cover_state_sensor_2).state; break;
              case 3: val = id(cover_state_sensor_3).state; break;
              case 4: val = id(cover_state_sensor_4).state; break;
              case 5: val = id(cover_state_sensor_5).state; break;
              case 6: val = id(cover_state_sensor_6).state; break;
            }
            if (!val.empty()) {
              id(cover_state_sensor).publish_state(val);
            }
          }
      - script.execute: cover_get_current_values

  - id: cover_get_current_values
    then:
      - lambda: |-
          if (id(cover_current_pos_sensor).has_state()) {
            float pos = id(cover_current_pos_sensor).state;
            lv_arc_set_value(id(cover_position_arc), (int)pos);
            char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", pos);
            lv_label_set_text(id(cover_pos_label), buf);
          }

  - id: cover_update_translations
    then:
      - lvgl.label.update:
          id: cover_state_label
          text: !lambda |-
            return id(i18n_translations).translate(("cover.state." + id(cover_state_sensor).state));

  - id: cover_set_open_style
    then:
      - lambda: |-
          // Get the correct icon based on current index
          const char* open_icons[] = {
            "${cover_icon_opened_1}",
            "${cover_icon_opened_2}",
            "${cover_icon_opened_3}",
            "${cover_icon_opened_4}",
            "${cover_icon_opened_5}",
            "${cover_icon_opened_6}"
          };
          int idx = id(current_cover_index) - 1;
          if (idx >= 0 && idx < 6) {
            lv_label_set_text(id(cover_icon), open_icons[idx]);
          }
          lv_obj_set_style_bg_color(id(cover_icon_bg), color_red, 0);
          lv_obj_set_style_text_color(id(cover_icon), color_red, 0);

  - id: cover_set_closed_style
    then:
      - lambda: |-
          // Get the correct icon based on current index
          const char* closed_icons[] = {
            "${cover_icon_closed_1}",
            "${cover_icon_closed_2}",
            "${cover_icon_closed_3}",
            "${cover_icon_closed_4}",
            "${cover_icon_closed_5}",
            "${cover_icon_closed_6}"
          };
          int idx = id(current_cover_index) - 1;
          if (idx >= 0 && idx < 6) {
            lv_label_set_text(id(cover_icon), closed_icons[idx]);
          }
          lv_obj_set_style_bg_color(id(cover_icon_bg), color_red, 0);
          lv_obj_set_style_text_color(id(cover_icon), color_red, 0);
