          id(cover_name_5_stored) = x;
          ESP_LOGD("cover_name", "Stored cover 5 name: %s", x.c_str());
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 5;'
          then:
            - lvgl.label.update:
                id: cover_name_label
                text: !lambda 'return x;'

  - platform: homeassistant
    id: cover_name_6
    entity_id: "${cover_entity_6}"
    attribute: friendly_name
    on_value:
      - lambda: |-
          id(cover_name_6_stored) = x;
          ESP_LOGD("cover_name", "Stored cover 6 name: %s", x.c_str());
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 6;'
          then:
            - lvgl.label.update:
                id: cover_name_label
                text: !lambda 'return x;'

  # Aggregator for state
  - platform: template
    id: cover_state_sensor
    internal: true
    lambda: |-
      auto get_state = [&](int idx) -> std::string {
        switch (idx) {
          case 1: return id(cover_state_sensor_1).state;
          case 2: return id(cover_state_sensor_2).state;
          case 3: return id(cover_state_sensor_3).state;
          case 4: return id(cover_state_sensor_4).state;
          case 5: return id(cover_state_sensor_5).state;
          case 6: return id(cover_state_sensor_6).state;
          default: return "";
        }
      };
      return get_state(id(current_cover_index));
    on_value:
      - script.execute: cover_update_translations
      - if:
          condition:
            lambda: 'return x == "open" || x == "opening";'
          then:
            - script.execute: cover_set_open_style
          else:
            - script.execute: cover_set_closed_style

  # Individual state sensors
  - platform: homeassistant
    id: cover_state_sensor_1
    entity_id: "${cover_entity_1}"
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 1;'
          then:
            - text_sensor.template.publish:
                id: cover_state_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_state_sensor_2
    entity_id: "${cover_entity_2}"
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 2;'
          then:
            - text_sensor.template.publish:
                id: cover_state_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_state_sensor_3
    entity_id: "${cover_entity_3}"
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 3;'
          then:
            - text_sensor.template.publish:
                id: cover_state_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_state_sensor_4
    entity_id: "${cover_entity_4}"
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 4;'
          then:
            - text_sensor.template.publish:
                id: cover_state_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_state_sensor_5
    entity_id: "${cover_entity_5}"
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 5;'
          then:
            - text_sensor.template.publish:
                id: cover_state_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_state_sensor_6
    entity_id: "${cover_entity_6}"
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 6;'
          then:
            - text_sensor.template.publish:
                id: cover_state_sensor
                state: !lambda 'return x;'

lvgl:

  top_layer:
    widgets:
      - obj:
          id: cover_select_widget
          hidden: true
          y: -60
          width: 440
          height: 100
          align: bottom_mid
          pad_all: 0
          bg_opa: transp
          border_opa: transp
          border_width: 0
          scrollable: false
          radius: 20
          widgets:
            - obj:
                id: cover_select_widget_cont
                width: 440
                height: 60
                align: center
                bg_opa: transp
                border_opa: transp
                border_width: 0
                pad_all: 0
                layout:
                  type: flex
                  flex_align_main: space_around
                  flex_align_cross: center
                  flex_align_track: center
                widgets:
