substitutions: !include substitutions.yaml

globals:
  # Global variables for friendly names
  - id: cover_name_1_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: cover_name_2_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: cover_name_3_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: cover_name_4_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: cover_name_5_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: cover_name_6_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: current_cover_index
    type: int
    initial_value: '1'
    restore_value: no

  - id: current_cover_entity
    type: std::string
    restore_value: false
    initial_value: '"${cover_entity_1}"'

sensor:
  # Template aggregators for shared UI updates (reactive to specific sensor changes when index matches)
  - platform: template
    id: cover_current_pos_sensor
    internal: true
    lambda: |-
      auto get_pos = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(cover_current_pos_sensor_1).state;
          case 2: return id(cover_current_pos_sensor_2).state;
          case 3: return id(cover_current_pos_sensor_3).state;
          case 4: return id(cover_current_pos_sensor_4).state;
          case 5: return id(cover_current_pos_sensor_5).state;
          case 6: return id(cover_current_pos_sensor_6).state;
          default: return {};
        }
      };
      return get_pos(id(current_cover_index));
    on_value:
      - if:
          condition:
            lambda: return id(cover_current_pos_sensor).has_state();
          then:
            - lvgl.label.update:
                id: cover_state_label
                y: -5

            - lvgl.arc.update:
                id: cover_position_arc
                value: !lambda return int(x);
                clickable: true
                indicator:
                  arc_color: color_red

            - lvgl.label.update:
                id: cover_pos_label
                text: !lambda |-
                  static char buf[8];
                  snprintf(buf, sizeof(buf), "%.0f%%", x);
                  return buf;

  # Individual HA sensors for each cover (consolidated on_value to publish only if active)
  - platform: homeassistant
    id: cover_current_pos_sensor_1
    entity_id: "${cover_entity_1}"
    attribute: current_position
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 1;'
          then:
            - sensor.template.publish:
                id: cover_current_pos_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_current_pos_sensor_2
    entity_id: "${cover_entity_2}"
    attribute: current_position
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 2;'
          then:
            - sensor.template.publish:
                id: cover_current_pos_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_current_pos_sensor_3
    entity_id: "${cover_entity_3}"
    attribute: current_position
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 3;'
          then:
            - sensor.template.publish:
                id: cover_current_pos_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_current_pos_sensor_4
    entity_id: "${cover_entity_4}"
    attribute: current_position
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 4;'
          then:
            - sensor.template.publish:
                id: cover_current_pos_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_current_pos_sensor_5
    entity_id: "${cover_entity_5}"
    attribute: current_position
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 5;'
          then:
            - sensor.template.publish:
                id: cover_current_pos_sensor
                state: !lambda 'return x;'

  - platform: homeassistant
    id: cover_current_pos_sensor_6
    entity_id: "${cover_entity_6}"
    attribute: current_position
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 6;'
          then:
            - sensor.template.publish:
                id: cover_current_pos_sensor
                state: !lambda 'return x;'

text_sensor:
  # Friendly name sensors - store in globals
  - platform: homeassistant
    id: cover_name_1
    entity_id: "${cover_entity_1}"
    attribute: friendly_name
    on_value:
      - lambda: |-
          id(cover_name_1_stored) = x;
          ESP_LOGD("cover_name", "Stored cover 1 name: %s", x.c_str());
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 1;'
          then:
            - lvgl.label.update:
                id: cover_name_label
                text: !lambda 'return x;'

  - platform: homeassistant
    id: cover_name_2
    entity_id: "${cover_entity_2}"
    attribute: friendly_name
    on_value:
      - lambda: |-
          id(cover_name_2_stored) = x;
          ESP_LOGD("cover_name", "Stored cover 2 name: %s", x.c_str());
      - if:
          condition:
            lambda: 'return id(current_cover_index) == 2;'
