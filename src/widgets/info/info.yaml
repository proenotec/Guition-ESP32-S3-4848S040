lvgl:
  pages:
    - id: info_page
      bg_color: color_black
      on_load:
        # ✅ Método centralizado
        - script.execute:
            id: set_active_page
            page_name: "info_page"
      <<: !include
        file: ../../widgets/swipe_navigation.yaml
      widgets:
        - obj:
            id: info_screen
            # Quitamos el layout FLEX aquí para permitir posicionamiento absoluto del botón cerrar
            height: 235
            width: 440
            text_font: nunito_18
            scrollable: false
            bg_color: white
            bg_opa: COVER
            radius: 0
            pad_all: 0
            widgets:
              # === CONTENEDOR DE CONTENIDO (Texto e Info) ===
              # Este contenedor mantiene el flujo vertical original
              - obj:
                  id: info_content_wrapper
                  layout:
                    type: flex
                    flex_flow: COLUMN_WRAP
                  width: 100%
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 2
                  widgets:
                    # Spacer that grows to push buttons to bottom
                    - obj:
                        radius: 0
                        pad_all: 0
                        border_width: 0
                        bg_opa: TRANSP
                        width: 100%
                        flex_grow: 1

                    # Info page buttons container
                    - obj:
                        id: info_buttons_container
                        hidden: false
                        radius: 5
                        pad_all: 3
                        border_width: 1
                        border_color: 0x555555
                        width: 310
                        height: 48
                        bg_color: 0xF0F0F0
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_main: SPACE_EVENLY
                          flex_align_cross: CENTER
                        widgets:
                          # Script Button 1
                          - button:
                              id: info_script_1
                              radius: 6
                              width: 70
                              height: 38
                              checkable: false
                              bg_color: 0x4CAF50  # Green
                              widgets:
                                - label:
                                    text_color: white
                                    align: center
                                    text: "Rain"
                                    text_font: nunito_18
                              on_press:
                                - homeassistant.service:
                                    service: script.turn_on
                                    data:
                                      entity_id: "script.rain_notification_for_the_day"
                                - script.execute:
                                    id: page_cleanup
                                    page_name: "info_page"
                                - lvgl.page.show: home_page

                          # Script Button 2
                          - button:
                              id: info_script_2
                              radius: 6
                              width: 90
                              height: 38
                              checkable: false
                              bg_color: 0x2196F3  # Blue
                              widgets:
                                - label:
                                    text_color: white
                                    align: center
                                    text: "Script 2"
                                    text_font: nunito_18
  #                            on_press:
  #                              - homeassistant.service:
  #                                  service: script.turn_on
  #                                  data:
  #                                    entity_id: "script.spare_script_2"
  #                              - lambda: |-
  #                                  if (id(active_lvgl_page) == "info_page") {
  #                                    ESP_LOGI("boot_screen", "Pressed button 2. Returning from info page to main page");
  #                                  }
  #                              - script.execute: hide_boot_screen_smart
  #                              - script.execute: play_beep

                          # Script Button 3
                          - button:
                              id: info_script_3
                              radius: 6
                              width: 90
                              height: 38
                              checkable: false
                              bg_color: 0xFF9800  # Orange
                              widgets:
                                - label:
                                    text_color: white
                                    align: center
                                    text: "Script 3"
                                    text_font: nunito_18
  #                            on_press:
  #                              - homeassistant.service:
  #                                  service: script.turn_on
  #                                  data:
  #                                    entity_id: "script.spare_script_3"
  #                              - lambda: |-
  #                                  if (id(active_lvgl_page) == "info_page") {
  #                                    ESP_LOGI("boot_screen", "Pressed button 3. Returning from info page to main page");
  #                                  }
  #                              - script.execute: hide_boot_screen_smart
  #                              - script.execute: play_beep

                    # Espacio extra abajo para que el contenido no pegue con el borde inferior
                    - obj:
                        radius: 0
                        pad_all: 0
                        border_width: 0
                        bg_opa: TRANSP
                        width: 100%
                        height: 5

        # BACK
        - obj:
            y: 0
            width: 80
            height: 50
            align: bottom_mid
            bg_opa: transp
            pad_all: 0
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 0
            widgets:
              - obj:
                  y: -20
                  width: 80
                  height: 5
                  align: bottom_mid
                  bg_color: color_steel_blue
                  pad_all: 0
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  radius: 15
            on_click:
              - script.execute:
                  id: page_cleanup
                  page_name: "info_page"
              - lvgl.page.show: home_page

