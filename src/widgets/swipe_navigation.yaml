---
# Swipe navigation
  on_swipe_right:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      - logger.log: "Swipe right"
      - lvgl.page.next:
          animation: OUT_RIGHT
          time: 300ms

  on_swipe_left:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      - logger.log: "Swipe left"
      - lvgl.page.previous:
          animation: OUT_LEFT
          time: 300ms

  on_swipe_down:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      - logger.log: "Swipe down"
      - lvgl.page.show: home_page

  on_swipe_up:
      - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
      - logger.log: "Swipe up"
      - lvgl.page.show: home_page
