# Variables globales
globals:
  - id: updating_progress1
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: candado_activo1
    type: bool
    restore_value: yes
    initial_value: 'false'

# Sensores desde Home Assistant
binary_sensor:
  - platform: homeassistant
    id: gatedoor_contact
    entity_id: binary_sensor.gatedoor_contact
    internal: true
    on_state:
      - lvgl.label.update:
          id: door_status_label
          text: !lambda |-
            if (x) {
              return "Puerta abierta";
            } else {
              return "Puerta cerrada";
            }
      - lvgl.label.update:
          id: gatedoor_icon
          text: !lambda |-
            if (x) {
              return "\U000F0343";  // mdi:gate-arrow-left
            } else {
              return "\U000F0D83";  // mdi:fence
            }
      - lvgl.label.update:
          id: gatedoor_icon
          text_color: !lambda |-
            if (x) {
              return lv_color_hex(0xFF0000);  // Rojo si abierta
            } else {
              return lv_color_hex(0x00FF00);  // Verde si cerrada
            }

  - platform: homeassistant
    id: kincony_cerradura
    entity_id: switch.kincony_a2_poe_cerradura_gate_a2_gatecmd
    internal: true
    on_state:
      - lvgl.label.update:
          id: kincony_status_label
          text: !lambda |-
            if (x) {
              return "Relé: ON";
            } else {
              return "Relé: OFF";
            }
          text_color: !lambda |-
            if (x) {
              return lv_color_hex(0x00FF00);  // Verde si ON
            } else {
              return lv_color_hex(0xFF0000);  // Rojo si OFF
            }

  - platform: homeassistant
    id: sonoff_motor
    entity_id: switch.sonoff_basiczbr3
    internal: true
    on_state:
      - lvgl.label.update:
          id: motor_button_label
          text: !lambda |-
            if (x) {
              return "Disable Motor";
            } else {
              return "Enable Motor";
            }

sensor:
  - platform: homeassistant
    id: door_battery
    entity_id: sensor.gatedoor_battery
    internal: true
    on_value:
      - lvgl.label.update:
          id: battery_label
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Batería: %.0f%%", x);
            return buf;

text_sensor:
  - platform: homeassistant
    id: gatedoor_last_seen
    entity_id: sensor.gatedoor_last_seen
    internal: true

# Número que actúa como slider de candado
number:
  - platform: template
    name: "Permite Candado1"
    id: progress_value1
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    initial_value: 0
    restore_value: false
    on_value:
      then:
        # Actualizar la posición del slider SOLO si no viene del slider
        - if:
            condition:
              lambda: 'return !id(updating_progress1);'
            then:
              - lambda: 'id(updating_progress1) = true;'
              - lvgl.slider.update:
                  id: progress_slider1
                  value: !lambda 'return x;'
              - lambda: 'id(updating_progress1) = false;'

        # Actualizar el label del porcentaje
        - lvgl.label.update:
            id: progress_label1
            text: !lambda |-
              char buf[32];
              sprintf(buf, "%.0f%%", x);
              return buf;

        # Activar candado SOLO cuando llega exactamente a 100
        - if:
            condition:
              lambda: 'return x >= 100;'
            then:
              - lambda: 'id(candado_activo1) = true;'
              - lvgl.label.update:
                  id: gate_status
                  text: "CANDADO ACTIVO"
                  text_color: 0x00FF00
              # HABILITAR BOTONES AQUÍ TAMBIÉN
              - lvgl.widget.update:
                  id: motor_button
                  state:
                    disabled: false
              - lvgl.widget.update:
                  id: gate_button
                  state:
                    disabled: false
              - lvgl.widget.update:
                  id: pedestrian_button
                  state:
                    disabled: false

        # Desactivar candado SOLO cuando llega a 0
        - if:
            condition:
              lambda: 'return x <= 0;'
            then:
              - lambda: 'id(candado_activo1) = false;'
              - lvgl.label.update:
                  id: gate_status
                  text: "CANDADO INACTIVO"
                  text_color: 0xFF0000
              # DESHABILITAR BOTONES AQUÍ TAMBIÉN
              - lvgl.widget.update:
                  id: motor_button
                  state:
                    disabled: true
              - lvgl.widget.update:
                  id: gate_button
                  state:
                    disabled: true
              - lvgl.widget.update:
                  id: pedestrian_button
                  state:
                    disabled: true

# Intervalo para decrementar automáticamente
interval:
  - interval: 1s
    then:
      - if:
          condition:
            - lambda: 'return id(active_lvgl_page) == "gate_page";'
            - lambda: 'return id(candado_activo1);'  # Solo si el candado está activo
          then:
            - lambda: |-
                if (id(progress_value1).state >= 100) {
                  delay(500);
                }
                if (id(progress_value1).state > 0) {
                  float new_value = id(progress_value1).state - 10;
                  if (new_value < 0) {
                    new_value = 0;
                  }
                  id(progress_value1).publish_state(new_value);
                }

lvgl:
  pages:
    - id: gate_page
      on_load:
        # ✅ Método centralizado
        - script.execute:
            id: set_active_page
            page_name: "gate_page"
        - lvgl.label.update:
            id: motor_button_label
            text: !lambda |-
              if (id(sonoff_motor).state) {
                return "Disable Motor";
              } else {
                return "Enable Motor";
              }
        # Actualizar estado del relé Kinkony
        - lvgl.label.update:
            id: kincony_status_label
            text: !lambda |-
              if (id(kincony_cerradura).state) {
                return "Relé: ON";
              } else {
                return "Relé: OFF";
              }
            text_color: !lambda |-
              if (id(kincony_cerradura).state) {
                return lv_color_hex(0x00FF00);  // Verde si ON
              } else {
                return lv_color_hex(0xFF0000);  // Rojo si OFF
              }
      widgets:
        # === SECCIÓN SLIDER DE CANDADO ===
        - obj:
            width: 100%
            height: 100
            y: 5
            pad_all: 8
            widgets:
              - label:
                  align: TOP_MID
                  y: 5
                  text: "Gate Control"
                  text_font: nunito_24
                  text_color: 0xFFFFFF

              - slider:
                  id: progress_slider1
                  align: CENTER
                  y: 5
                  width: 80%
                  height: 35
                  min_value: 0
                  max_value: 100
                  value: 0
                  pad_all: 8
                  bg_color: 0x333333
                  indicator:
                    bg_color: 0x00FF00
                    bg_grad_color: 0xFFFF00
                    bg_grad_dir: HOR
                  knob:
                    bg_color: 0x2F8CD8
                    radius: 15
                    width: 30
                    height: 30
                  on_value:
                    then:
                      - lambda: |-
                          if (!id(updating_progress1)) {
                            id(updating_progress1) = true;
                            id(progress_value1).publish_state(x);
                            id(updating_progress1) = false;
                          }

              - label:
                  id: progress_label1
                  align: BOTTOM_MID
                  y: -20
                  text: "0%"
                  text_font: nunito_16

              - label:
                  id: gate_status
                  align: TOP_RIGHT
                  x: -10
                  y: 5
                  text: "CANDADO INACTIVO"
                  text_font: nunito_14
                  text_color: 0xFF0000

        # === SECCIÓN BOTONES DE CONTROL ===
        - obj:
            width: 100%
            height: 260
            y: 110
            pad_all: 8
            widgets:
              # Botón Enable/Disable Motor
              - button:
                  id: motor_button
                  align: TOP_LEFT
                  x: 10
                  y: 5
                  width: 45%
                  height: 70
                  checkable: false
                  state:
                    disabled: true
                  bg_color: 0xFF6400
                  widgets:
                    - label:
                        id: motor_button_label
                        align: CENTER
                        text: "Enable Motor"
                        text_font: nunito_18
                  on_press:
                    - if:
                        condition:
                          lambda: 'return id(candado_activo1);'
                        then:
                          - homeassistant.service:
                              service: switch.toggle
                              data:
                                entity_id: "switch.sonoff_basiczbr3"
                          - lvgl.label.update:
                              id: status_msg1
                              text: "Motor cambiado"

              # Botón Puerta Corredera
              - button:
                  id: gate_button
                  align: TOP_RIGHT
                  x: -10
                  y: 5
                  width: 45%
                  height: 70
                  checkable: false
                  state:
                    disabled: true
                  widgets:
                    - label:
                        id: gatedoor_icon
                        align: CENTER
                        text: "\U000F0D83"
                        text_font: mdi_icons_32
                        text_color: 0x00FF00
                  on_press:
                    - if:
                        condition:
                          and:
                            - lambda: 'return id(candado_activo1);'
                            - binary_sensor.is_off: kincony_cerradura
                        then:
                          - homeassistant.service:
                              service: switch.turn_on
                              data:
                                entity_id: "switch.kincony_a2_poe_cerradura_gate_a2_gatecmd"
                          - lvgl.label.update:
                              id: status_msg1
                              text: "Activando puerta"

              # Label estado puerta
              - label:
                  id: door_status_label
                  align: TOP_MID
                  y: 90
                  text: "Puerta cerrada"
                  text_font: nunito_18
                  text_color: 0x0000FF

              # Botón Modo Peatonal
              - button:
                  id: pedestrian_button
                  align: CENTER
                  y: 40
                  width: 90%
                  height: 70
                  checkable: false
                  state:
                    disabled: true
                  bg_color: 0x0000FF
                  widgets:
                    - label:
                        align: CENTER
                        text: "Modo Peatonal"
                        text_font: nunito_18
                  on_press:
                    - if:
                        condition:
                          and:
                            - lambda: 'return id(candado_activo1);'
                            - binary_sensor.is_off: kincony_cerradura
                        then:
                          - homeassistant.service:
                              service: script.pedestrian_gate_controller
                          - lvgl.label.update:
                              id: status_msg1
                              text: "Modo peatonal activado"

              # Mensaje de estado
              - label:
                  id: status_msg1
                  align: BOTTOM_MID
                  y: -15
                  text: "Desliza para quitar candado"
                  text_font: nunito_18
                  text_color: 0x0000FF

        # === SECCIÓN SENSORES ===
        - obj:
            width: 100%
            height: 60
            y: 375
            pad_all: 8
            widgets:
              - label:
                  id: battery_label
                  align: TOP_LEFT
                  x: 10
                  y: 5
                  text: "Batería: --"
                  text_font: nunito_12

              - label:
                  id: kincony_status_label
                  align: TOP_RIGHT
                  x: -10
                  y: 5
                  text: "Relé: OFF"
                  text_font: nunito_12
                  text_color: 0xFF0000  # Rojo por defecto

        # === BOTÓN BACK ===
        - obj:
            y: 0
            width: 80
            height: 50
            align: bottom_mid
            bg_opa: transp
            pad_all: 0
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 0
            widgets:
              - obj:
                  y: -20
                  width: 80
                  height: 5
                  align: bottom_mid
                  bg_color: color_steel_blue
                  pad_all: 0
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  radius: 15
            on_click:
              - script.execute:
                  id: page_cleanup
                  page_name: "gate_page"
              - lvgl.page.show: home_page
