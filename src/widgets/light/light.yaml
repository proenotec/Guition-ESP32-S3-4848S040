          ESP_LOGD("light_widget", "Light 4 modes: temp=%d hs=%d rgb=%d bright=%d",
            id(light_4_supports_color_temp), id(light_4_supports_hs),
            id(light_4_supports_rgb), id(light_4_supports_brightness));
      - if:
          condition:
            lambda: 'return id(current_light_index) == 4;'
          then:
            - text_sensor.template.publish:
                id: light_supported_modes
                state: !lambda 'return x;'

  - platform: homeassistant
    id: light_supported_modes_5
    entity_id: "${light_entity_5}"
    attribute: supported_color_modes
    internal: true
    on_value:
      - lambda: |-
