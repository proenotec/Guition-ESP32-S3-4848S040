            id(light_3_supports_color_temp)
          );

          ESP_LOGD("light_widget", "Light 3 modes: temp=%d hs=%d rgb=%d bright=%d",
            id(light_3_supports_color_temp), id(light_3_supports_hs),
            id(light_3_supports_rgb), id(light_3_supports_brightness));
      - if:
          condition:
            lambda: 'return id(current_light_index) == 3;'
          then:
            - text_sensor.template.publish:
                id: light_supported_modes
                state: !lambda 'return x;'

  - platform: homeassistant
    id: light_supported_modes_4
    entity_id: "${light_entity_4}"
    attribute: supported_color_modes
    internal: true
    on_value:
      - lambda: |-
          std::string modes = x;

          // Store capabilities for light 4
          id(light_4_supports_color_temp) = (modes.find("color_temp") != std::string::npos);
          id(light_4_supports_hs) = (modes.find("hs") != std::string::npos);
          id(light_4_supports_rgb) = (modes.find("rgb") != std::string::npos);
          id(light_4_supports_brightness) = (
            modes.find("brightness") != std::string::npos ||
