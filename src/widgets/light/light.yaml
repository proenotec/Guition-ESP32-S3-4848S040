binary_sensor:
  # Individual binary sensors for state (publish via template on_state)
  - platform: homeassistant
    id: light_state_1
    entity_id: "${light_entity_1}"
    internal: true
    trigger_on_initial_state: true
    on_state:
      - script.execute: light_update_all_selector_icons

  - platform: homeassistant
    id: light_state_2
    entity_id: "${light_entity_2}"
    internal: true
    trigger_on_initial_state: true
    on_state:
      - script.execute: light_update_all_selector_icons

  - platform: homeassistant
    id: light_state_3
    entity_id: "${light_entity_3}"
    internal: true
    trigger_on_initial_state: true
    on_state:
      - script.execute: light_update_all_selector_icons

  - platform: homeassistant
    id: light_state_4
    entity_id: "${light_entity_4}"
    internal: true
    trigger_on_initial_state: true
    on_state:
      - script.execute: light_update_all_selector_icons

  - platform: homeassistant
    id: light_state_5
    entity_id: "${light_entity_5}"
    internal: true
    trigger_on_initial_state: true
    on_state:
      - script.execute: light_update_all_selector_icons

  - platform: homeassistant
    id: light_state_6
    entity_id: "${light_entity_6}"
    internal: true
    trigger_on_initial_state: true
    on_state:
      - script.execute: light_update_all_selector_icons

  # Template aggregator for shared light state (on/off)
  - platform: template
    id: light_state
    lambda: |-
      auto get_state = [&](int idx) -> bool {
        switch (idx) {
          case 1: return id(light_state_1).state;
          case 2: return id(light_state_2).state;
          case 3: return id(light_state_3).state;
          case 4: return id(light_state_4).state;
          case 5: return id(light_state_5).state;
          case 6: return id(light_state_6).state;
          default: return false;
        }
      };
      return get_state(id(current_light_index));
    on_press:
      - script.execute: light_update_lightbulb_color
      - script.execute: light_update_button_icon_color
    on_release:
      - script.execute: light_update_lightbulb_color
      - script.execute: light_update_button_icon_color

  # Shared LVGL button control for toggle and mode switch
  - platform: lvgl
    id: light_btn_control
    widget: light_lightbulb_btn
    on_click:
      # SHORT press (50-500ms) - ALWAYS turns the lamp on/off
      - min_length: 50ms
        max_length: 500ms
        then:
          - lambda: |-
              ESP_LOGD("light_btn", "Short press - toggling light");
          - homeassistant.service:
              service: homeassistant.toggle
              data:
                entity_id: !lambda 'return id(current_light_entity);'

      # LONG press (800-3000ms) - mode switching (only if supported)
      - min_length: 800ms
        max_length: 3000ms
        then:
          - if:
              condition:
                lambda: |-
                  return id(light_supports_color_temp) &&
                         (id(light_supports_hs) || id(light_supports_rgb));
              then:
                - lambda: |-
                    id(light_is_temp_mode) = !id(light_is_temp_mode);
                    ESP_LOGD("light_btn", "Long press - switching mode to: %s",
                      id(light_is_temp_mode) ? "ColorTemp" : "HS");
                - script.execute: light_toggle_gradient
              else:
                - lambda: |-
                    ESP_LOGD("light_btn", "Long press ignored - only one color mode supported");

sensor:
  # Template aggregators for shared UI updates
  - platform: template
    id: light_brightness
    internal: true
    lambda: |-
      auto get_brightness = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(light_brightness_1).state;
          case 2: return id(light_brightness_2).state;
          case 3: return id(light_brightness_3).state;
          case 4: return id(light_brightness_4).state;
          case 5: return id(light_brightness_5).state;
          case 6: return id(light_brightness_6).state;
          default: return {};
        }
      };
      return get_brightness(id(current_light_index));
    on_value:
      - if:
          condition:
            lambda: 'return !std::isnan(x);'
          then:
            - globals.set:
                id: light_current_brightness
                value: !lambda 'return x;'
            - lvgl.slider.update:
                id: light_brightness_slider
                value: !lambda 'return int(x);'
            - script.execute: light_update_lightbulb_color
            - script.execute: light_update_button_icon_color

  - platform: template
    id: light_color_temp
    internal: true
    lambda: |-
      auto get_color_temp = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(light_color_temp_1).state;
          case 2: return id(light_color_temp_2).state;
          case 3: return id(light_color_temp_3).state;
          case 4: return id(light_color_temp_4).state;
          case 5: return id(light_color_temp_5).state;
          case 6: return id(light_color_temp_6).state;
          default: return {};
        }
      };
      return get_color_temp(id(current_light_index));
    on_value:
      - if:
          condition:
            lambda: 'return !std::isnan(x);'
          then:
            - globals.set:
                id: light_current_color_temp
                value: !lambda 'return x;'
            - lvgl.arc.update:
                id: light_arc_color_temp
                value: !lambda 'return int(x);'
            - if:
                condition:
                  lambda: 'return id(light_is_temp_mode);'
