script:

  # NEW: Script para actualizar el color de TODOS los iconos del selector
  - id: light_update_all_selector_icons
    then:
      - lambda: |-
          // Helper function para calcular el color de un icono según su estado
          auto get_icon_color = [](int index) -> lv_color_t {
            bool is_on = false;
            int brightness = 100;
            float hue = 0.0f;
            float sat = 0.0f;
            float temp = 3000.0f;
            bool has_color = false;
            bool is_temp_mode_local = false;

            // Get state for this light
            switch (index) {
              case 1:
                is_on = id(light_state_1).state;
                if (id(light_brightness_1).has_state()) brightness = id(light_brightness_1).state;
                break;
              case 2:
                is_on = id(light_state_2).state;
                if (id(light_brightness_2).has_state()) brightness = id(light_brightness_2).state;
                break;
              case 3:
                is_on = id(light_state_3).state;
                if (id(light_brightness_3).has_state()) brightness = id(light_brightness_3).state;
                break;
              case 4:
                is_on = id(light_state_4).state;
                if (id(light_brightness_4).has_state()) brightness = id(light_brightness_4).state;
                break;
              case 5:
                is_on = id(light_state_5).state;
                if (id(light_brightness_5).has_state()) brightness = id(light_brightness_5).state;
                break;
              case 6:
                is_on = id(light_state_6).state;
                if (id(light_brightness_6).has_state()) brightness = id(light_brightness_6).state;
                break;
            }

            // If light is OFF, return gray
            if (!is_on) {
              return lv_color_make(153, 153, 153);  // 60% gray
            }

            // Check if this light has color capabilities
            std::string modes = "";
            switch (index) {
              case 1: modes = id(light_supported_modes_1).state; break;
              case 2: modes = id(light_supported_modes_2).state; break;
              case 3: modes = id(light_supported_modes_3).state; break;
              case 4: modes = id(light_supported_modes_4).state; break;
              case 5: modes = id(light_supported_modes_5).state; break;
              case 6: modes = id(light_supported_modes_6).state; break;
            }

            bool supports_temp = (modes.find("color_temp") != std::string::npos);
            bool supports_hs = (modes.find("hs") != std::string::npos);
            bool supports_rgb = (modes.find("rgb") != std::string::npos);
            has_color = supports_temp || supports_hs || supports_rgb;

            // If light is ON but has no color support, return yellow
            if (!has_color) {
              uint8_t val = 204;  // 80% of 255
              if (modes.find("brightness") != std::string::npos || supports_hs || supports_rgb || supports_temp) {
                float bright_scale = 0.6 + (brightness / 255.0 * 0.4);
                val = 255 * bright_scale;
              }
              return lv_color_make(val, val, 0);
            }

            // Get color data for this light
            // Determine mode: prefer HS if available and hs_color is not empty
            std::string hs_str = "";
            switch (index) {
              case 1: hs_str = id(light_hs_color_1).state; break;
              case 2: hs_str = id(light_hs_color_2).state; break;
              case 3: hs_str = id(light_hs_color_3).state; break;
              case 4: hs_str = id(light_hs_color_4).state; break;
              case 5: hs_str = id(light_hs_color_5).state; break;
              case 6: hs_str = id(light_hs_color_6).state; break;
            }

            // Parse HS if available
            if (!hs_str.empty() && hs_str != "None" && (supports_hs || supports_rgb)) {
              size_t start = hs_str.find('(') + 1;
              size_t comma = hs_str.find(',');
              size_t end = hs_str.find(')');
              if (start < comma && comma < end) {
                hue = atof(hs_str.substr(start, comma - start).c_str());
                sat = atof(hs_str.substr(comma + 1, end - comma - 1).c_str());
                is_temp_mode_local = false;
              }
            } else if (supports_temp) {
              // Use color temp
              switch (index) {
                case 1: if (id(light_color_temp_1).has_state()) temp = id(light_color_temp_1).state; break;
                case 2: if (id(light_color_temp_2).has_state()) temp = id(light_color_temp_2).state; break;
                case 3: if (id(light_color_temp_3).has_state()) temp = id(light_color_temp_3).state; break;
                case 4: if (id(light_color_temp_4).has_state()) temp = id(light_color_temp_4).state; break;
                case 5: if (id(light_color_temp_5).has_state()) temp = id(light_color_temp_5).state; break;
                case 6: if (id(light_color_temp_6).has_state()) temp = id(light_color_temp_6).state; break;
              }
              is_temp_mode_local = true;
            }

            // Calculate RGB color
            uint8_t r = 255, g = 255, b = 255;
            if (is_temp_mode_local) {
              // Kelvin to RGB
              float t = temp / 100.0f;
              float r_val = 0.0f, g_val = 0.0f, b_val = 0.0f;
              if (t <= 66.0f) {
                r_val = 255.0f;
                g_val = 99.4708025861f * log(t) - 161.1195681661f;
                if (t <= 19.0f) b_val = 0.0f;
                else b_val = 138.5177312231f * log(t - 10.0f) - 305.0447927307f;
              } else {
                r_val = 329.698727446f * pow(t - 60.0f, -0.1332047592f);
                g_val = 288.1221695283f * pow(t - 60.0f, -0.0755148492f);
                b_val = 255.0f;
              }
              r = (uint8_t)fminf(fmaxf(r_val, 0.0f), 255.0f);
              g = (uint8_t)fminf(fmaxf(g_val, 0.0f), 255.0f);
              b = (uint8_t)fminf(fmaxf(b_val, 0.0f), 255.0f);
            } else {
              // HS to RGB
              uint16_t h = (uint16_t)fminf(fmaxf(hue, 0.0f), 359.0f);
              uint8_t s = (uint8_t)fminf(fmaxf(sat, 0.0f), 100.0f);
              lv_color_t full = lv_color_hsv_to_rgb(h, s, 100);
              lv_color32_t full32;
              full32.full = lv_color_to32(full);
              r = full32.ch.red;
              g = full32.ch.green;
              b = full32.ch.blue;
            }

            // Apply brightness scaling (60% to 100%)
            float bright_scale = 0.6 + (brightness / 255.0 * 0.4);
            r = r * bright_scale;
            g = g * bright_scale;
            b = b * bright_scale;

            return lv_color_make(r, g, b);
          };

          // Update all 4 selector icons
          lv_obj_set_style_text_color(id(light_icon_1), get_icon_color(1), 0);
          lv_obj_set_style_text_color(id(light_icon_2), get_icon_color(2), 0);
          lv_obj_set_style_text_color(id(light_icon_3), get_icon_color(3), 0);
          lv_obj_set_style_text_color(id(light_icon_4), get_icon_color(4), 0);
          lv_obj_set_style_text_color(id(light_icon_5), get_icon_color(5), 0);
          lv_obj_set_style_text_color(id(light_icon_6), get_icon_color(6), 0);

  - id: get_light_amount_btn
    then:
      - lambda: |-
          int lights = ${lights_amount};

          if (lights >= 2) {
            lv_obj_set_width(id(light_select_widget), 190);
            lv_obj_set_width(id(light_select_widget_cont), 130);
            lv_obj_clear_flag(id(light_btn_1), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(light_btn_2), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(light_btn_1), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(light_btn_2), LV_OBJ_FLAG_HIDDEN);
          }

          if (lights >= 3) {
            lv_obj_set_width(id(light_select_widget), 245);
            lv_obj_set_width(id(light_select_widget_cont), 185);
            lv_obj_clear_flag(id(light_btn_3), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(light_btn_3), LV_OBJ_FLAG_HIDDEN);
          }

          if (lights >= 4) {
            lv_obj_set_width(id(light_select_widget), 300);
            lv_obj_set_width(id(light_select_widget_cont), 240);
            lv_obj_clear_flag(id(light_btn_4), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(light_btn_4), LV_OBJ_FLAG_HIDDEN);
          }

          if (lights >= 5) {
            lv_obj_set_width(id(light_select_widget), 355);
            lv_obj_set_width(id(light_select_widget_cont), 295);
            lv_obj_clear_flag(id(light_btn_5), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(light_btn_5), LV_OBJ_FLAG_HIDDEN);
          }

          if (lights >= 6) {
            lv_obj_set_width(id(light_select_widget), 410);
            lv_obj_set_width(id(light_select_widget_cont), 350);
            lv_obj_clear_flag(id(light_btn_6), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(light_btn_6), LV_OBJ_FLAG_HIDDEN);
          }

  # Script to switch to a new light index (called from select buttons)
  - id: light_switch_index
    parameters:
      position: int
    then:
      - lambda: |-
          id(current_light_index) = position;
          std::string entity = "";
          switch (position) {
            case 1: entity = "${light_entity_1}"; break;
            case 2: entity = "${light_entity_2}"; break;
            case 3: entity = "${light_entity_3}"; break;
            case 4: entity = "${light_entity_4}"; break;
            case 5: entity = "${light_entity_5}"; break;
            case 6: entity = "${light_entity_6}"; break;
            default: entity = "${light_entity_1}";
          }
          id(current_light_entity) = entity;
          ESP_LOGD("light_switch", "Switched to light index %d: %s", position, entity.c_str());

          // Copy per-light capabilities to current light capabilities
          switch (position) {
            case 1:
              id(light_supports_color_temp) = id(light_1_supports_color_temp);
              id(light_supports_hs) = id(light_1_supports_hs);
              id(light_supports_rgb) = id(light_1_supports_rgb);
              id(light_supports_brightness) = id(light_1_supports_brightness);
              break;
            case 2:
              id(light_supports_color_temp) = id(light_2_supports_color_temp);
              id(light_supports_hs) = id(light_2_supports_hs);
              id(light_supports_rgb) = id(light_2_supports_rgb);
              id(light_supports_brightness) = id(light_2_supports_brightness);
              break;
            case 3:
              id(light_supports_color_temp) = id(light_3_supports_color_temp);
              id(light_supports_hs) = id(light_3_supports_hs);
              id(light_supports_rgb) = id(light_3_supports_rgb);
              id(light_supports_brightness) = id(light_3_supports_brightness);
              break;
            case 4:
              id(light_supports_color_temp) = id(light_4_supports_color_temp);
              id(light_supports_hs) = id(light_4_supports_hs);
              id(light_supports_rgb) = id(light_4_supports_rgb);
              id(light_supports_brightness) = id(light_4_supports_brightness);
              break;
            case 5:
              id(light_supports_color_temp) = id(light_5_supports_color_temp);
              id(light_supports_hs) = id(light_5_supports_hs);
              id(light_supports_rgb) = id(light_5_supports_rgb);
              id(light_supports_brightness) = id(light_5_supports_brightness);
              break;
            case 6:
              id(light_supports_color_temp) = id(light_6_supports_color_temp);
              id(light_supports_hs) = id(light_6_supports_hs);
              id(light_supports_rgb) = id(light_6_supports_rgb);
              id(light_supports_brightness) = id(light_6_supports_brightness);
              break;
          }

          ESP_LOGD("light_switch", "Current capabilities: temp=%d hs=%d rgb=%d bright=%d",
            id(light_supports_color_temp), id(light_supports_hs),
            id(light_supports_rgb), id(light_supports_brightness));

          // Force publish all attributes for the new index to templates
          if (position == 1 && id(light_brightness_1).has_state()) {
            id(light_brightness).publish_state(id(light_brightness_1).state);
          } else if (position == 2 && id(light_brightness_2).has_state()) {
            id(light_brightness).publish_state(id(light_brightness_2).state);
          } else if (position == 3 && id(light_brightness_3).has_state()) {
            id(light_brightness).publish_state(id(light_brightness_3).state);
          } else if (position == 4 && id(light_brightness_4).has_state()) {
            id(light_brightness).publish_state(id(light_brightness_4).state);
          } else if (position == 5 && id(light_brightness_5).has_state()) {
            id(light_brightness).publish_state(id(light_brightness_5).state);
          } else if (position == 6 && id(light_brightness_6).has_state()) {
            id(light_brightness).publish_state(id(light_brightness_6).state);
          }

          // State
          bool state_val = false;
          switch (position) {
            case 1: state_val = id(light_state_1).state; break;
            case 2: state_val = id(light_state_2).state; break;
            case 3: state_val = id(light_state_3).state; break;
            case 4: state_val = id(light_state_4).state; break;
            case 5: state_val = id(light_state_5).state; break;
            case 6: state_val = id(light_state_6).state; break;
            default: state_val = false;
          }
          id(light_state).publish_state(state_val);

          // NEW: Update friendly name label from stored globals
          std::string name = "";
          switch (position) {
            case 1: name = id(light_name_1_stored); break;
            case 2: name = id(light_name_2_stored); break;
            case 3: name = id(light_name_3_stored); break;
            case 4: name = id(light_name_4_stored); break;
            case 5: name = id(light_name_5_stored); break;
            case 6: name = id(light_name_6_stored); break;
            default: name = "Light";
          }
          ESP_LOGD("light_name_x_stored", "%s", name.c_str());
          if (name.empty()) {
            name = "Undefined";
          }
          lv_label_set_text(id(light_name_label), name.c_str());

          // Auto-select mode if only one supported
          if (!(id(light_supports_color_temp) && (id(light_supports_hs) || id(light_supports_rgb)))) {
            if (id(light_supports_hs) || id(light_supports_rgb)) {
              id(light_is_temp_mode) = false;
            } else if (id(light_supports_color_temp)) {
              id(light_is_temp_mode) = true;
            }
            id(light_toggle_gradient).execute();
          }
      - script.execute: light_update_layout
      - script.execute: light_update_lightbulb_color
      - script.execute: light_update_button_icon_color

# Initial load script (call on boot after delay)
  - id: light_init
    then:
      - delay: 1s
      - lambda: |-
          id(current_light_index) = 1;
          id(current_light_entity) = "${light_entity_1}";
      - script.execute:
          id: light_switch_index
          position: 1

  # Update layout based on supports and mode (like original on_mount)
  - id: light_update_layout
    then:
      # Assume BACK button always at bottom center
      - lvgl.obj.update:
          id: light_back_btn
          align: bottom_mid
          x: 0

      # MANAGING BRIGHTNESS SLIDER VISIBILITY
      - if:
          condition:
            lambda: 'return id(light_supports_brightness);'
          then:
            - lvgl.widget.show: light_brightness_background

            # Check if saturation is visible
            - if:
                condition:
                  lambda: |-
                    return !id(light_is_temp_mode) &&
                           (id(light_supports_hs) || id(light_supports_rgb));
                then:
                  # Saturation visible → brightness at -160
                  - lvgl.obj.update:
                      id: light_brightness_background
                      x: -160
                      y: 0
                      radius: 20
                      width: 80
                      height: 260
                  - lvgl.slider.update:
                      id: light_brightness_slider
                      width: 60
                      height: 240
                else:
                  # No saturation → brightness at -110 (ALWAYS VERTICAL)
                  - lvgl.obj.update:
                      id: light_brightness_background
                      x: -110
                      y: 0
                      radius: 20
                      width: 80
                      height: 260
                  - lvgl.slider.update:
                      id: light_brightness_slider
                      width: 60
                      height: 240
          else:
            - lvgl.widget.hide: light_brightness_background

      # MANAGING SATURATION SLIDER VISIBILITY
      - if:
          condition:
            lambda: 'return id(light_supports_hs) || id(light_supports_rgb);'
          then:
            - if:
                condition:
                  lambda: 'return !id(light_is_temp_mode);'
                then:
                  - lvgl.widget.show: light_saturation_background
                  - lvgl.obj.update:
                      id: light_brightness_background
                      x: -160
                else:
                  - lvgl.widget.hide: light_saturation_background
                  - lvgl.obj.update:
                      id: light_brightness_background
                      x: -110
          else:
            - lvgl.widget.hide: light_saturation_background

      # MANAGING HS ARC AND GRADIENT VISIBILITY
      - if:
          condition:
            lambda: 'return id(light_supports_hs) || id(light_supports_rgb);'
          then:
            - if:
                condition:
                  lambda: 'return !id(light_is_temp_mode);'
                then:
                  - lvgl.widget.show: light_hue_gradient_obj
                  - lvgl.widget.show: light_arc_hue
                else:
                  - lvgl.widget.hide: light_hue_gradient_obj
                  - lvgl.widget.hide: light_arc_hue
          else:
            - lvgl.widget.hide: light_hue_gradient_obj
            - lvgl.widget.hide: light_arc_hue

      # MANAGING COLOR TEMP ARC AND GRADIENT VISIBILITY
      - if:
          condition:
            lambda: 'return id(light_supports_color_temp);'
          then:
            - if:
                condition:
                  lambda: 'return id(light_is_temp_mode);'
                then:
                  - lvgl.widget.show: light_color_temp_gradient_obj
                  - lvgl.widget.show: light_arc_color_temp
                else:
                  - lvgl.widget.hide: light_color_temp_gradient_obj
                  - lvgl.widget.hide: light_arc_color_temp
          else:
            - lvgl.widget.hide: light_color_temp_gradient_obj
            - lvgl.widget.hide: light_arc_color_temp

  # Toggle gradient visibility and reposition
  - id: light_toggle_gradient
    then:
      - if:
          condition:
            lambda: 'return id(light_is_temp_mode);'
          then:
            - lvgl.widget.show: light_color_temp_gradient_obj
            - lvgl.widget.show: light_arc_color_temp
            - lvgl.widget.hide: light_hue_gradient_obj
            - lvgl.widget.hide: light_arc_hue
          else:
            - lvgl.widget.show: light_hue_gradient_obj
            - lvgl.widget.show: light_arc_hue
            - lvgl.widget.hide: light_color_temp_gradient_obj
            - lvgl.widget.hide: light_arc_color_temp
      - script.execute: light_update_layout  # Reposition sliders

  # Update lightbulb color based on current mode/values (placeholder - implement HSV/RGB conversion)
  - id: light_update_lightbulb_color
    then:
      - lambda: |-
          bool is_on = id(light_state).state;
          if (!is_on) {
            // Off: gray
            lv_obj_set_style_bg_color(id(light_lightbulb_obj), color_steel_blue, 0);
            return;
          }

          // Check if light has color capabilities
          bool has_color = id(light_supports_color_temp) ||
                          id(light_supports_hs) ||
                          id(light_supports_rgb);

          int bright = id(light_current_brightness);
          lv_color_t col;

          if (!has_color) {
            // Simple lamp - show bright yellow scaled by brightness
            // Use a brighter base color and better scaling
            float bright_scale = 0.7 + (bright / 255.0 * 0.3);  // 70% to 100% range
            uint8_t val = (uint8_t)(255 * bright_scale);
            col = lv_color_make(val, val, 0);  // Bright yellow
          } else if (id(light_is_temp_mode)) {
            // Kelvin to RGB (Tanner Helland approximation)
            float kelvin = id(light_current_color_temp);
            float temp = kelvin / 100.0f;
            float r_val = 0.0f, g_val = 0.0f, b_val = 0.0f;
            if (temp <= 66.0f) {
              r_val = 255.0f;
              g_val = temp;
              g_val = 99.4708025861f * log(g_val) - 161.1195681661f;
              if (temp <= 19.0f) {
                b_val = 0.0f;
              } else {
                b_val = temp - 10.0f;
                b_val = 138.5177312231f * log(b_val) - 305.0447927307f;
              }
            } else {
              r_val = temp - 60.0f;
              r_val = 329.698727446f * pow(r_val, -0.1332047592f);
              g_val = temp - 60.0f;
              g_val = 288.1221695283f * pow(g_val, -0.0755148492f);
              b_val = 255.0f;
            }
            // Clamp 0-255
            uint8_t r = (uint8_t)fminf(fmaxf(r_val, 0.0f), 255.0f);
            uint8_t g = (uint8_t)fminf(fmaxf(g_val, 0.0f), 255.0f);
            uint8_t b = (uint8_t)fminf(fmaxf(b_val, 0.0f), 255.0f);
            // Scale by brightness (60% to 100%)
            float bright_scale = 0.6 + (bright / 255.0 * 0.4);
            r = (uint8_t)(r * bright_scale);
            g = (uint8_t)(g * bright_scale);
            b = (uint8_t)(b * bright_scale);
            col = lv_color_make(r, g, b);
          } else {
            // HS to RGB, scaled by brightness
            float hue_f = id(light_current_hue);
            float sat_f = id(light_current_saturation);
            uint16_t hue = (uint16_t)fminf(fmaxf(hue_f, 0.0f), 359.0f);
            uint8_t sat = (uint8_t)fminf(fmaxf(sat_f, 0.0f), 100.0f);
            lv_color_t full = lv_color_hsv_to_rgb(hue, sat, 100);  // Full value
            lv_color32_t full32;
            full32.full = lv_color_to32(full);
            // Scale by brightness (60% to 100%)
            float bright_scale = 0.6 + (bright / 255.0 * 0.4);
            uint8_t r = (uint8_t)(full32.ch.red * bright_scale);
            uint8_t g = (uint8_t)(full32.ch.green * bright_scale);
            uint8_t b = (uint8_t)(full32.ch.blue * bright_scale);
            col = lv_color_make(r, g, b);
          }
          lv_obj_set_style_bg_color(id(light_lightbulb_obj), col, 0);

  # Update button icon color (similar to bulb)
  - id: light_update_button_icon_color
    then:
      - lambda: |-
          // Similar logic as above, but for icon label
          bool is_on = id(light_state).state;
          if (!is_on) {
            lv_obj_set_style_text_color(id(light_icon_label), color_steel_blue, 0);
            return;
          }

          int bright = id(light_current_brightness);
          lv_color_t col;
          if (id(light_is_temp_mode)) {
            // Reuse Kelvin logic from above (duplicate for simplicity; could extract to global fn)
            float kelvin = id(light_current_color_temp);
            float temp = kelvin / 100.0f;
            float r_val = 0.0f, g_val = 0.0f, b_val = 0.0f;
            if (temp <= 66.0f) {
              r_val = 255.0f;
              g_val = temp;
              g_val = 99.4708025861f * log(g_val) - 161.1195681661f;
              if (temp <= 19.0f) {
                b_val = 0.0f;
              } else {
                b_val = temp - 10.0f;
                b_val = 138.5177312231f * log(b_val) - 305.0447927307f;
              }
            } else {
              r_val = temp - 60.0f;
              r_val = 329.698727446f * pow(r_val, -0.1332047592f);
              g_val = temp - 60.0f;
              g_val = 288.1221695283f * pow(g_val, -0.0755148492f);
              b_val = 255.0f;
            }
            uint8_t r = (uint8_t)fminf(fmaxf(r_val, 0.0f), 255.0f);
            uint8_t g = (uint8_t)fminf(fmaxf(g_val, 0.0f), 255.0f);
            uint8_t b = (uint8_t)fminf(fmaxf(b_val, 0.0f), 255.0f);
            r = (uint8_t)((uint16_t)r * bright / 255);
            g = (uint8_t)((uint16_t)g * bright / 255);
            b = (uint8_t)((uint16_t)b * bright / 255);
            col = lv_color_make(r, g, b);
          } else {
            // Reuse HS logic from above
            float hue_f = id(light_current_hue);
            float sat_f = id(light_current_saturation);
            uint16_t hue = (uint16_t)fminf(fmaxf(hue_f, 0.0f), 359.0f);
            uint8_t sat = (uint8_t)fminf(fmaxf(sat_f, 0.0f), 100.0f);
            lv_color_t full = lv_color_hsv_to_rgb(hue, sat, 100);
            lv_color32_t full32;
            full32.full = lv_color_to32(full);
            uint8_t r = (uint8_t)((uint16_t)full32.ch.red * bright / 255);
            uint8_t g = (uint8_t)((uint16_t)full32.ch.green * bright / 255);
            uint8_t b = (uint8_t)((uint16_t)full32.ch.blue * bright / 255);
            col = lv_color_make(r, g, b);
          }
          lv_obj_set_style_text_color(id(light_icon_label), col, 0);

