text_sensor:
  # Template aggregator for HS color
  - platform: template
    id: light_hs_color
    internal: true
    lambda: |-
      auto get_hs = [&](int idx) -> std::string {
        switch (idx) {
          case 1: return id(light_hs_color_1).state;
          case 2: return id(light_hs_color_2).state;
          case 3: return id(light_hs_color_3).state;
          case 4: return id(light_hs_color_4).state;
          case 5: return id(light_hs_color_5).state;
          case 6: return id(light_hs_color_6).state;
          default: return "";
        }
      };
      return get_hs(id(current_light_index));
    on_value:
      - if:
          condition:
            lambda: "return x != \"None\" && !x.empty();"
          then:
            - lambda: |-
                std::string s = x;
                size_t start = s.find('(') + 1;
                size_t comma = s.find(',');
                size_t end = s.find(')');
                float hue = 0.0f, sat = 0.0f;
                if (start < comma && comma < end) {
                  hue = atof(s.substr(start, comma - start).c_str());
                  sat = atof(s.substr(comma + 1, end - comma - 1).c_str());
                }
                id(light_current_hue) = hue;
                id(light_current_saturation) = sat;
            - lvgl.arc.update:
                id: light_arc_hue
                value: !lambda 'return id(light_current_hue);'
            - if:
                condition:
                  lambda: |-
                    return !id(light_is_temp_mode) &&
                           (id(light_supports_hs) || id(light_supports_rgb));
                then:
                  - lvgl.slider.update:
                      id: light_saturation_slider
                      value: !lambda 'return id(light_current_saturation);'
            - if:
                condition:
                  lambda: 'return !id(light_is_temp_mode);'
                then:
                  - script.execute: light_update_lightbulb_color
                  - script.execute: light_update_button_icon_color

  # Template aggregator for supported color modes
  - platform: template
    id: light_supported_modes
    internal: true
    lambda: |-
      auto get_modes = [&](int idx) -> std::string {
        switch (idx) {
          case 1: return id(light_supported_modes_1).state;
          case 2: return id(light_supported_modes_2).state;
          case 3: return id(light_supported_modes_3).state;
          case 4: return id(light_supported_modes_4).state;
          case 5: return id(light_supported_modes_5).state;
          case 6: return id(light_supported_modes_6).state;
          default: return "";
        }
      };
      return get_modes(id(current_light_index));
    on_value:
      - lambda: |-
          // Parsing a string with supported modes
          std::string modes = x;

          // We check the presence of each mode
          id(light_supports_color_temp) = (modes.find("color_temp") != std::string::npos);
          id(light_supports_hs) = (modes.find("hs") != std::string::npos);
          id(light_supports_rgb) = (modes.find("rgb") != std::string::npos);

          id(light_supports_brightness) = (
            modes.find("brightness") != std::string::npos ||
            id(light_supports_hs) ||
            id(light_supports_rgb) ||
            id(light_supports_color_temp)
          );

          ESP_LOGD("light_widget", "Supported modes parsed for index %d", id(current_light_index));

          // Reset initial load if needed and re-init layout
          if (!id(light_initial_load_complete)) {
            id(light_initial_load_complete) = true;
          }
          id(light_update_layout).execute();

  # Individual HA text sensors for each light
  - platform: homeassistant
    id: light_hs_color_1
    entity_id: "${light_entity_1}"
    attribute: hs_color
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_light_index) == 1;'
          then:
            - text_sensor.template.publish:
                id: light_hs_color
                state: !lambda 'return x;'
      - script.execute: light_update_all_selector_icons

  # Individual HA text sensors for each light's supported modes
  - platform: homeassistant
    id: light_supported_modes_1
    entity_id: "${light_entity_1}"
    attribute: supported_color_modes
    internal: true
    on_value:
      - lambda: |-
          std::string modes = x;

          // Store capabilities for light 1
          id(light_1_supports_color_temp) = (modes.find("color_temp") != std::string::npos);
          id(light_1_supports_hs) = (modes.find("hs") != std::string::npos);
          id(light_1_supports_rgb) = (modes.find("rgb") != std::string::npos);
          id(light_1_supports_brightness) = (
            modes.find("brightness") != std::string::npos ||
            id(light_1_supports_hs) ||
            id(light_1_supports_rgb) ||
            id(light_1_supports_color_temp)
          );

          ESP_LOGD("light_widget", "Light 1 modes: temp=%d hs=%d rgb=%d bright=%d",
            id(light_1_supports_color_temp), id(light_1_supports_hs),
            id(light_1_supports_rgb), id(light_1_supports_brightness));
      - if:
          condition:
            lambda: 'return id(current_light_index) == 1;'
          then:
            - text_sensor.template.publish:
                id: light_supported_modes
                state: !lambda 'return x;'

  - platform: homeassistant
    id: light_supported_modes_2
    entity_id: "${light_entity_2}"
    attribute: supported_color_modes
    internal: true
    on_value:
      - lambda: |-
          std::string modes = x;

          // Store capabilities for light 2
          id(light_2_supports_color_temp) = (modes.find("color_temp") != std::string::npos);
          id(light_2_supports_hs) = (modes.find("hs") != std::string::npos);
          id(light_2_supports_rgb) = (modes.find("rgb") != std::string::npos);
          id(light_2_supports_brightness) = (
            modes.find("brightness") != std::string::npos ||
            id(light_2_supports_hs) ||
            id(light_2_supports_rgb) ||
            id(light_2_supports_color_temp)
          );

          ESP_LOGD("light_widget", "Light 2 modes: temp=%d hs=%d rgb=%d bright=%d",
            id(light_2_supports_color_temp), id(light_2_supports_hs),
            id(light_2_supports_rgb), id(light_2_supports_brightness));
      - if:
          condition:
            lambda: 'return id(current_light_index) == 2;'
          then:
            - text_sensor.template.publish:
                id: light_supported_modes
                state: !lambda 'return x;'

  - platform: homeassistant
    id: light_supported_modes_3
    entity_id: "${light_entity_3}"
    attribute: supported_color_modes
    internal: true
    on_value:
      - lambda: |-
          std::string modes = x;

          // Store capabilities for light 3
          id(light_3_supports_color_temp) = (modes.find("color_temp") != std::string::npos);
          id(light_3_supports_hs) = (modes.find("hs") != std::string::npos);
          id(light_3_supports_rgb) = (modes.find("rgb") != std::string::npos);
          id(light_3_supports_brightness) = (
            modes.find("brightness") != std::string::npos ||
            id(light_3_supports_hs) ||
