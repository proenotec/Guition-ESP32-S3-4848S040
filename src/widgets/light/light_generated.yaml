binary_sensor:
  - platform: homeassistant
    id: light_state_1
    entity_id: "${light_entity_1}"
    internal: true
    trigger_on_initial_state: true
    on_state:
      - script.execute: light_update_all_selector_icons
      - script.execute: update_home_lights_btn_color
  - platform: homeassistant
    id: light_state_2
    entity_id: "${light_entity_2}"
    internal: true
    trigger_on_initial_state: true
    on_state:
