  - platform: template
    id: light_supported_modes
    internal: true
    lambda: |-
      auto get_modes = [&](int idx) -> std::string {
        switch (idx) {
          case 1: return id(light_supported_modes_1).state;
          case 2: return id(light_supported_modes_2).state;
          case 3: return id(light_supported_modes_3).state;
          case 4: return id(light_supported_modes_4).state;
          case 5: return id(light_supported_modes_5).state;
          case 6: return id(light_supported_modes_6).state;
          case 7: return id(light_supported_modes_7).state;
          default: return "";
        }
      };
      return get_modes(id(current_light_index));
    on_value:
      - lambda: |-
          std::string modes = x;
          id(light_supports_color_temp) = (modes.find("color_temp") != std::string::npos);
          id(light_supports_hs) = (modes.find("hs") != std::string::npos);
          id(light_supports_rgb) = (modes.find("rgb") != std::string::npos);
          id(light_supports_brightness) = (
            modes.find("brightness") != std::string::npos ||
            id(light_supports_hs) ||
            id(light_supports_rgb) ||
            id(light_supports_color_temp)
          );
          ESP_LOGD("light_widget", "Supported modes parsed for index %d", id(current_light_index));
          if (!id(light_initial_load_complete)) {
            id(light_initial_load_complete) = true;
          }
          id(light_update_layout).execute();
