                id: light_hs_color
                state: !lambda 'return x;'
            - script.execute: light_update_all_selector_icons
  - platform: template
    id: light_hs_color
    internal: true
    lambda: |-
      auto get_hs = [&](int idx) -> std::string {
        switch (idx) {
          case 1: return id(light_hs_color_1).state;
          case 2: return id(light_hs_color_2).state;
          case 3: return id(light_hs_color_3).state;
          case 4: return id(light_hs_color_4).state;
          case 5: return id(light_hs_color_5).state;
          case 6: return id(light_hs_color_6).state;
          case 7: return id(light_hs_color_7).state;
          default: return "";
        }
      };
      return get_hs(id(current_light_index));
    on_value:
      - if:
          condition:
            lambda: 'return x != "None" && !x.empty();'
          then:
            - lambda: |-
                std::string s = x;
                size_t start = s.find('(') + 1;
                size_t comma = s.find(',');
                size_t end = s.find(')');
                float hue = 0.0, sat = 0.0;
                if (start < comma && comma < end) {
                  hue = atof(s.substr(start, comma - start).c_str());
                  sat = atof(s.substr(comma + 1, end - comma - 1).c_str());
                }
