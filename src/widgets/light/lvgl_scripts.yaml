script:
  # Update layout based on supports and mode (like original on_mount)
  - id: light_update_layout
    then:
      # Assume BACK button always at bottom center
      - lvgl.obj.update:
          id: light_back_btn
          align: bottom_mid
          x: 0

      # MANAGING BRIGHTNESS SLIDER VISIBILITY
      - if:
          condition:
            lambda: 'return id(light_supports_brightness);'
          then:
            - lvgl.widget.show: light_brightness_background

            # Check if saturation is visible
            - if:
                condition:
                  lambda: |-
                    return !id(light_is_temp_mode) &&
                           (id(light_supports_hs) || id(light_supports_rgb));
                then:
                  # Saturation visible → brightness at -160
                  - lvgl.obj.update:
                      id: light_brightness_background
                      x: -160
                      y: 0
                      radius: 20
                      width: 80
                      height: 260
                  - lvgl.slider.update:
                      id: light_brightness_slider
                      width: 60
                      height: 240
                else:
                  # No saturation → brightness at -110 (ALWAYS VERTICAL)
                  - lvgl.obj.update:
                      id: light_brightness_background
                      x: -110
                      y: 0
                      radius: 20
                      width: 80
                      height: 260
                  - lvgl.slider.update:
                      id: light_brightness_slider
                      width: 60
                      height: 240
          else:
            - lvgl.widget.hide: light_brightness_background

      # MANAGING SATURATION SLIDER VISIBILITY
      - if:
          condition:
            lambda: 'return id(light_supports_hs) || id(light_supports_rgb);'
          then:
            - if:
                condition:
                  lambda: 'return !id(light_is_temp_mode);'
                then:
                  - lvgl.widget.show: light_saturation_background
                  - lvgl.obj.update:
                      id: light_brightness_background
                      x: -160
                else:
                  - lvgl.widget.hide: light_saturation_background
                  - lvgl.obj.update:
                      id: light_brightness_background
                      x: -110
          else:
            - lvgl.widget.hide: light_saturation_background

      # MANAGING HS ARC AND GRADIENT VISIBILITY
      - if:
          condition:
            lambda: 'return id(light_supports_hs) || id(light_supports_rgb);'
          then:
            - if:
                condition:
                  lambda: 'return !id(light_is_temp_mode);'
                then:
                  - lvgl.widget.show: light_hue_gradient_obj
                  - lvgl.widget.show: light_arc_hue
                else:
                  - lvgl.widget.hide: light_hue_gradient_obj
                  - lvgl.widget.hide: light_arc_hue
          else:
            - lvgl.widget.hide: light_hue_gradient_obj
            - lvgl.widget.hide: light_arc_hue

      # MANAGING COLOR TEMP ARC AND GRADIENT VISIBILITY
      - if:
          condition:
            lambda: 'return id(light_supports_color_temp);'
          then:
            - if:
                condition:
                  lambda: 'return id(light_is_temp_mode);'
                then:
                  - lvgl.widget.show: light_color_temp_gradient_obj
                  - lvgl.widget.show: light_arc_color_temp
                else:
                  - lvgl.widget.hide: light_color_temp_gradient_obj
                  - lvgl.widget.hide: light_arc_color_temp
          else:
            - lvgl.widget.hide: light_color_temp_gradient_obj
            - lvgl.widget.hide: light_arc_color_temp

  # Initial load script (call on boot after delay)
  - id: light_init
    then:
      - delay: 1s
      - lambda: |-
          id(current_light_index) = 1;
          id(current_light_entity) = "${light_entity_1}";
      - script.execute:
          id: light_switch_index
          position: 1

  # Update button icon color (similar to bulb)
  - id: light_update_button_icon_color
    then:
      - lambda: |-
          // Similar logic as above, but for icon label
          bool is_on = id(light_state).state;
          if (!is_on) {
            lv_obj_set_style_text_color(id(light_icon_label), color_steel_blue, 0);
            return;
          }

          int bright = id(light_current_brightness);
          lv_color_t col;
          if (id(light_is_temp_mode)) {
            // Reuse Kelvin logic from above (duplicate for simplicity; could extract to global fn)
            float kelvin = id(light_current_color_temp);
            float temp = kelvin / 100.0f;
            float r_val = 0.0f, g_val = 0.0f, b_val = 0.0f;
            if (temp <= 66.0f) {
              r_val = 255.0f;
              g_val = temp;
              g_val = 99.4708025861f * log(g_val) - 161.1195681661f;
              if (temp <= 19.0f) {
                b_val = 0.0f;
              } else {
                b_val = temp - 10.0f;
                b_val = 138.5177312231f * log(b_val) - 305.0447927307f;
              }
            } else {
              r_val = temp - 60.0f;
              r_val = 329.698727446f * pow(r_val, -0.1332047592f);
              g_val = temp - 60.0f;
              g_val = 288.1221695283f * pow(g_val, -0.0755148492f);
              b_val = 255.0f;
            }
            uint8_t r = (uint8_t)fminf(fmaxf(r_val, 0.0f), 255.0f);
            uint8_t g = (uint8_t)fminf(fmaxf(g_val, 0.0f), 255.0f);
            uint8_t b = (uint8_t)fminf(fmaxf(b_val, 0.0f), 255.0f);
            r = (uint8_t)((uint16_t)r * bright / 255);
            g = (uint8_t)((uint16_t)g * bright / 255);
            b = (uint8_t)((uint16_t)b * bright / 255);
            col = lv_color_make(r, g, b);
          } else {
            // Reuse HS logic from above
            float hue_f = id(light_current_hue);
            float sat_f = id(light_current_saturation);
            uint16_t hue = (uint16_t)fminf(fmaxf(hue_f, 0.0f), 359.0f);
            uint8_t sat = (uint8_t)fminf(fmaxf(sat_f, 0.0f), 100.0f);
            lv_color_t full = lv_color_hsv_to_rgb(hue, sat, 100);
            lv_color32_t full32;
            full32.full = lv_color_to32(full);
            uint8_t r = (uint8_t)((uint16_t)full32.ch.red * bright / 255);
            uint8_t g = (uint8_t)((uint16_t)full32.ch.green * bright / 255);
            uint8_t b = (uint8_t)((uint16_t)full32.ch.blue * bright / 255);
            col = lv_color_make(r, g, b);
          }
          lv_obj_set_style_text_color(id(light_icon_label), col, 0);

  # Update lightbulb color based on current mode/values (placeholder - implement HSV/RGB conversion)
  - id: light_update_lightbulb_color
    then:
      - lambda: |-
          bool is_on = id(light_state).state;
          if (!is_on) {
            // Off: gray
            lv_obj_set_style_bg_color(id(light_lightbulb_obj), color_steel_blue, 0);
            return;
          }

          // Check if light has color capabilities
          bool has_color = id(light_supports_color_temp) ||
                          id(light_supports_hs) ||
                          id(light_supports_rgb);

          int bright = id(light_current_brightness);
          lv_color_t col;

          if (!has_color) {
            // Simple lamp - show bright yellow scaled by brightness
            // Use a brighter base color and better scaling
            float bright_scale = 0.7 + (bright / 255.0 * 0.3);  // 70% to 100% range
            uint8_t val = (uint8_t)(255 * bright_scale);
            col = lv_color_make(val, val, 0);  // Bright yellow
          } else if (id(light_is_temp_mode)) {
            // Kelvin to RGB (Tanner Helland approximation)
            float kelvin = id(light_current_color_temp);
            float temp = kelvin / 100.0f;
            float r_val = 0.0f, g_val = 0.0f, b_val = 0.0f;
            if (temp <= 66.0f) {
              r_val = 255.0f;
              g_val = temp;
              g_val = 99.4708025861f * log(g_val) - 161.1195681661f;
              if (temp <= 19.0f) {
                b_val = 0.0f;
              } else {
                b_val = temp - 10.0f;
                b_val = 138.5177312231f * log(b_val) - 305.0447927307f;
              }
            } else {
              r_val = temp - 60.0f;
              r_val = 329.698727446f * pow(r_val, -0.1332047592f);
              g_val = temp - 60.0f;
              g_val = 288.1221695283f * pow(g_val, -0.0755148492f);
              b_val = 255.0f;
            }
            // Clamp 0-255
            uint8_t r = (uint8_t)fminf(fmaxf(r_val, 0.0f), 255.0f);
            uint8_t g = (uint8_t)fminf(fmaxf(g_val, 0.0f), 255.0f);
            uint8_t b = (uint8_t)fminf(fmaxf(b_val, 0.0f), 255.0f);
            // Scale by brightness (60% to 100%)
            float bright_scale = 0.6 + (bright / 255.0 * 0.4);
            r = (uint8_t)(r * bright_scale);
            g = (uint8_t)(g * bright_scale);
            b = (uint8_t)(b * bright_scale);
            col = lv_color_make(r, g, b);
          } else {
            // HS to RGB, scaled by brightness
            float hue_f = id(light_current_hue);
            float sat_f = id(light_current_saturation);
            uint16_t hue = (uint16_t)fminf(fmaxf(hue_f, 0.0f), 359.0f);
            uint8_t sat = (uint8_t)fminf(fmaxf(sat_f, 0.0f), 100.0f);
            lv_color_t full = lv_color_hsv_to_rgb(hue, sat, 100);  // Full value
            lv_color32_t full32;
            full32.full = lv_color_to32(full);
            // Scale by brightness (60% to 100%)
            float bright_scale = 0.6 + (bright / 255.0 * 0.4);
            uint8_t r = (uint8_t)(full32.ch.red * bright_scale);
            uint8_t g = (uint8_t)(full32.ch.green * bright_scale);
            uint8_t b = (uint8_t)(full32.ch.blue * bright_scale);
            col = lv_color_make(r, g, b);
          }
          lv_obj_set_style_bg_color(id(light_lightbulb_obj), col, 0);

  - id: light_toggle_gradient
    then:
      - if:
          condition:
            lambda: 'return id(light_is_temp_mode);'
          then:
            - lvgl.widget.show: light_color_temp_gradient_obj
            - lvgl.widget.show: light_arc_color_temp
            - lvgl.widget.hide: light_hue_gradient_obj
            - lvgl.widget.hide: light_arc_hue
          else:
            - lvgl.widget.show: light_hue_gradient_obj
            - lvgl.widget.show: light_arc_hue
            - lvgl.widget.hide: light_color_temp_gradient_obj
            - lvgl.widget.hide: light_arc_color_temp
      - script.execute: light_update_layout  # Reposition sliders

