lvgl:
  gradients:
  - id: light_hue_gradient
    direction: ver
    dither: none
    stops:
    - color: 16711680
      position: 0
    - color: 16776960
      position: 43
    - color: 65280
      position: 85
    - color: 65535
      position: 128
    - color: 255
      position: 171
    - color: 16711935
      position: 213
    - color: 16711680
      position: 255
  - id: light_color_temp_gradient
    direction: ver
    dither: none
    stops:
    - color: 10537215
      position: 0
    - color: 14743551
      position: 80
    - color: 16777215
      position: 128
    - color: 16777184
      position: 175
    - color: 16766624
      position: 255
  on_boot:
    then:
    - script.execute: light_init
    - lvgl.obj.update:
        id: light_btn_1
        bg_opa: cover
        bg_color: color_steel_blue
    - delay: 1s
    - script.execute: light_update_all_selector_icons
