  pages:
  - id: light_control_page
    bg_color: color_slate_blue_gray
    on_load:
    - script.execute:
        id: set_active_page
        page_name: light_control_page
    - script.execute: light_update_layout
    - delay: 200ms
    - script.execute: light_update_lightbulb_color
    - script.execute: light_update_button_icon_color
    widgets:
    - obj:
        id: light_brightness_background
        x: -160
        y: 0
        radius: 20
        width: 80
        height: 260
        align: center
        bg_color: color_slate_blue_gray
        pad_all: 0
        border_opa: transp
        border_width: 0
        shadow_color: color_black
        shadow_spread: 2
        shadow_width: 8
        widgets:
        - slider:
            id: light_brightness_slider
            radius: 16
            width: 60
            height: 240
            align: center
            bg_color: color_steel_blue
            shadow_color: color_black
            shadow_spread: 4
            shadow_width: 6
            shadow_opa: transp
            min_value: 2
            max_value: 255
            indicator:
              bg_color: color_deep_orange
              radius: 10
            knob:
              bg_opa: transp
            on_value:
            - globals.set:
                id: light_current_brightness
                value: !lambda 'return x;'
            - script.execute: light_update_lightbulb_color
            - script.execute: light_update_button_icon_color
            on_release:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(current_light_entity);'
                  brightness: !lambda 'return int(x);'
    - obj:
        id: light_saturation_background
        x: -60
        y: 0
        radius: 20
        width: 80
        height: 260
        align: center
        bg_color: color_slate_blue_gray
        pad_all: 0
        border_opa: transp
        border_width: 0
        shadow_color: color_black
        shadow_spread: 2
        shadow_width: 8
        widgets:
        - slider:
            id: light_saturation_slider
            radius: 16
            width: 60
            height: 240
            align: center
            bg_color: color_steel_blue
            shadow_color: color_black
            shadow_spread: 4
            shadow_width: 6
            shadow_opa: transp
            min_value: 0
            max_value: 100
            indicator:
              bg_color: color_red
              radius: 10
            knob:
              bg_opa: transp
            on_value:
            - globals.set:
                id: light_current_saturation
                value: !lambda 'return x;'
            - script.execute: light_update_lightbulb_color
            - script.execute: light_update_button_icon_color
            on_release:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(current_light_entity);'
                data_template:
                  hs_color: '"{{ (hue|float, sat|float)|list }}"'
                variables:
                  hue: !lambda 'return id(light_current_hue);'
                  sat: !lambda 'return x;'
    - label:
        id: light_name_label
        y: -30
        x: 0
        height: 40
        width: 240
        long_mode: dot
        align: bottom_left
        text_font: nunito_20
        text_align: center
        text_color: color_misty_blue
        text: Light
    - obj:
        id: light_bg_main_temperature
        hidden: false
        width: 240
        height: 480
        align: right_mid
        pad_all: 0
        bg_opa: transp
        clickable: false
        scrollable: false
        border_opa: transp
        border_width: 0
        shadow_opa: transp
        widgets:
        - obj:
            x: 240
            width: 480
            height: 480
            scrollable: false
            align: right_mid
            pad_all: 0
            bg_opa: transp
            shadow_opa: transp
            border_opa: transp
            border_width: 0
            widgets:
            - obj:
                width: 460
                height: 460
                align: center
                clickable: true
                radius: 260
                bg_opa: transp
                bg_color: color_slate_blue_gray
                border_color: color_black
                border_opa: 40%
                border_width: 3
            - obj:
                id: light_hue_gradient_obj
                hidden: true
                x: 222
                width: 444
                height: 444
                radius: 222
                align: right_mid
                pad_all: 0
                bg_grad: light_hue_gradient
                bg_grad_dir: ver
                shadow_opa: transp
                border_opa: transp
                border_width: 0
            - obj:
                id: light_color_temp_gradient_obj
                x: 222
                width: 444
                height: 444
                radius: 222
                align: right_mid
                pad_all: 0
                bg_grad: light_color_temp_gradient
                bg_grad_dir: ver
                shadow_opa: transp
                border_opa: transp
                border_width: 0
            - obj:
                x: 188
                width: 376
                height: 376
                align: right_mid
                clickable: false
                radius: 230
                bg_color: color_slate_blue_gray
                border_width: 0
                border_opa: transp
            - obj:
                x: 183
                width: 366
                height: 366
                align: right_mid
                radius: 230
                bg_color: color_slate_blue_gray
                border_color: color_white
                border_width: 3
                border_opa: 15%
            - obj:
                x: 222
                width: 444
                height: 444
                radius: 222
                align: right_mid
                pad_all: 0
                bg_opa: transp
                shadow_opa: transp
                border_opa: transp
                border_width: 0
                widgets:
                - arc:
                    id: light_arc_hue
                    hidden: true
                    clickable: true
                    adjustable: true
                    adv_hittest: true
                    align: center
                    width: 444
                    height: 444
                    start_angle: 0
                    end_angle: 180
                    min_value: 0
                    max_value: 360
                    value: 265
                    arc_width: 34
                    rotation: 90.0
                    arc_opa: transp
                    indicator:
                      arc_opa: transp
                      arc_width: 34
                    knob:
                      pad_all: 0
                      bg_opa: transp
                      border_color: color_steel_blue
                      border_width: 4
                      shadow_opa: transp
                    on_value:
                    - globals.set:
                        id: light_current_hue
                        value: !lambda 'return x;'
                    - script.execute: light_update_lightbulb_color
                    - script.execute: light_update_button_icon_color
                    on_release:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: !lambda 'return id(current_light_entity);'
                        data_template:
                          hs_color: '"{{ (hue|float, sat|float)|list }}"'
                        variables:
                          hue: !lambda 'return x;'
                          sat: !lambda 'return id(light_current_saturation);'
                - arc:
                    id: light_arc_color_temp
                    hidden: false
                    clickable: true
                    adjustable: true
                    adv_hittest: true
                    align: center
                    width: 444
                    height: 444
                    start_angle: 0
                    end_angle: 180
                    min_value: 2000
                    max_value: 6500
                    value: 3000
                    arc_width: 34
                    rotation: 90.0
                    arc_opa: transp
                    indicator:
                      arc_opa: transp
                      arc_width: 34
                    knob:
                      pad_all: 0
                      bg_opa: transp
                      border_color: color_steel_blue
                      border_width: 4
                      shadow_opa: transp
                    on_value:
                    - globals.set:
                        id: light_current_color_temp
                        value: !lambda 'return x;'
                    - script.execute: light_update_lightbulb_color
                    - script.execute: light_update_button_icon_color
                    on_release:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: !lambda 'return id(current_light_entity);'
                          color_temp_kelvin: !lambda 'return int(x);'
    - obj:
        id: light_lightbulb_btn
        x: 0
        width: 160
        height: 160
        align: right_mid
        bg_opa: transp
        pad_all: 0
        border_opa: transp
        border_width: 0
        shadow_opa: transp
        radius: 100
        widgets:
        - obj:
            id: light_lightbulb_obj
            clickable: false
            x: 0
            y: -30
            width: 70
            height: 70
            radius: 35
            align: center
            bg_color: color_light_gray
            border_opa: transp
            shadow_opa: transp
        - image:
            id: light_lightbulb_image
            x: 0
            y: 23
            align: center
            src: lightbulb_image
        - label:
            id: light_icon_label
            align: center
            y: -30
            text_font: icons_40
            text_color: color_misty_blue
            text: ${lightbulb}
    - obj:
        id: light_back_btn
        x: 150
        y: 0
        width: 80
        height: 70
        align: bottom_left
        bg_opa: transp
        pad_all: 0
        border_opa: transp
        border_width: 0
        shadow_opa: transp
        radius: 0
        widgets:
        - obj:
            y: -20
            width: 80
            height: 5
            align: bottom_mid
            bg_color: color_steel_blue
            pad_all: 0
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 15
        on_click:
        - lvgl.widget.hide: light_select_widget
        - delay: 100ms
        - script.execute:
            id: page_cleanup
            page_name: light_control_page
        - lvgl.page.show: home_page
