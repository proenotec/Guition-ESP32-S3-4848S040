script:
  # ✅ NUEVO SCRIPT: Refrescar ventilador actual sin cambiar el índice
  - id: fan_refresh_current
    then:
      - lambda: |-
          int idx = id(current_fan_index);
          const int num = ${fans_amount};

          // Asegurarse de que el índice es válido
          if (idx < 1 || idx > num) {
            idx = 1;
            id(current_fan_index) = idx;
          }

          std::string entity = "";
          std::string name = "";

          switch (idx) {
            case 1:
              entity = "${fan_entity_1}";
              name = id(fan_name_1_stored);
              break;
            case 2:
              entity = "${fan_entity_2}";
              name = id(fan_name_2_stored);
              break;
          }

          id(current_fan_entity) = entity;

          if (!name.empty()) {
            lv_label_set_text(id(fan_name_label), name.c_str());
          }

          ESP_LOGD("fan_refresh", "Refreshing current fan index %d: %s (%s)",
                   idx, name.c_str(), entity.c_str());

          // Actualizar botones de selección
          lv_obj_set_style_bg_opa(id(fan_btn_1), LV_OPA_TRANSP, 0);
          lv_obj_set_style_bg_opa(id(fan_btn_2), LV_OPA_TRANSP, 0);

          lv_obj_set_style_text_color(id(fan_icon_label_1), color_misty_blue, 0);
          lv_obj_set_style_text_color(id(fan_icon_label_2), color_misty_blue, 0);

          switch (idx) {
            case 1:
              lv_obj_set_style_bg_opa(id(fan_btn_1), LV_OPA_COVER, 0);
              lv_obj_set_style_bg_color(id(fan_btn_1), color_steel_blue, 0);
              lv_obj_set_style_text_color(id(fan_icon_label_1), color_white, 0);
              break;
            case 2:
              lv_obj_set_style_bg_opa(id(fan_btn_2), LV_OPA_COVER, 0);
              lv_obj_set_style_bg_color(id(fan_btn_2), color_steel_blue, 0);
              lv_obj_set_style_text_color(id(fan_icon_label_2), color_white, 0);
              break;
          }

          // Forzar actualización de sensores agregados
          if (id(fan_sensor_percentage).has_state()) {
            id(fan_sensor_percentage).publish_state(id(fan_sensor_percentage).state);
          }
          if (id(fan_sensor_supported_features).has_state()) {
            id(fan_sensor_supported_features).publish_state(id(fan_sensor_supported_features).state);
          }
          if (id(fan_sensor_percentage_step).has_state()) {
            id(fan_sensor_percentage_step).publish_state(id(fan_sensor_percentage_step).state);
          }
          id(fan_state_sensor).publish_state(id(fan_state_sensor).state);

  # Script to cycle through fans
  - id: fan_cycle
    then:
      - lambda: |-
          int next_idx = id(current_fan_index) + 1;
          if (next_idx > ${fans_amount}) next_idx = 1;

          std::string next_entity = "";
          std::string next_name = "";
          switch (next_idx) {
            case 1:
              next_entity = "${fan_entity_1}";
              next_name = id(fan_name_1_stored);
              break;
            case 2:
              next_entity = "${fan_entity_2}";
              next_name = id(fan_name_2_stored);
              break;
          }

          id(current_fan_index) = next_idx;
          id(current_fan_entity) = next_entity;

          lv_label_set_text(id(fan_name_label), next_name.c_str());

          // Force refresh of aggregated sensors
          if (id(fan_sensor_percentage).has_state()) {
            id(fan_sensor_percentage).publish_state(id(fan_sensor_percentage).state);
          }
          if (id(fan_sensor_supported_features).has_state()) {
            id(fan_sensor_supported_features).publish_state(id(fan_sensor_supported_features).state);
          }
          id(fan_state_sensor).publish_state(id(fan_state_sensor).state);
          // id(fan_preset_mode_sensor).publish_state(id(fan_preset_mode_sensor).state);

  # Script to set fan index (called from select.yaml buttons)
  - id: fan_set_index
    parameters:
      index: int
    then:
      - lambda: |-
          const int num = ${fans_amount};
          if (index > 0 && index <= num) {
            int next_idx = index;
            std::string next_entity = "";
            std::string next_name = "";
            switch (next_idx) {
              case 1:
                next_entity = "${fan_entity_1}";
                next_name = id(fan_name_1_stored);
                break;
              case 2:
                next_entity = "${fan_entity_2}";
                next_name = id(fan_name_2_stored);
                break;
            }

            id(current_fan_index) = next_idx;
            id(current_fan_entity) = next_entity;

            lv_label_set_text(id(fan_name_label), next_name.c_str());

            // Reset all button backgrounds to transparent
            lv_obj_set_style_bg_opa(id(fan_btn_1), LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(id(fan_btn_2), LV_OPA_TRANSP, 0);

            // Reset all icon colors to misty_blue
            lv_obj_set_style_text_color(id(fan_icon_label_1), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(fan_icon_label_2), color_misty_blue, 0);

            // Highlight the selected button
            switch (index) {
              case 1:
                lv_obj_set_style_bg_opa(id(fan_btn_1), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(fan_btn_1), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(fan_icon_label_1), color_white, 0);
                break;
              case 2:
                lv_obj_set_style_bg_opa(id(fan_btn_2), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(fan_btn_2), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(fan_icon_label_2), color_white, 0);
                break;
            }

            // Force refresh
            if (id(fan_sensor_percentage).has_state()) {
              id(fan_sensor_percentage).publish_state(id(fan_sensor_percentage).state);
            }
            if (id(fan_sensor_supported_features).has_state()) {
              id(fan_sensor_supported_features).publish_state(id(fan_sensor_supported_features).state);
            }
            id(fan_state_sensor).publish_state(id(fan_state_sensor).state);
            // id(fan_preset_mode_sensor).publish_state(id(fan_preset_mode_sensor).state);
          }

  # Animation scripts
  - id: fan_start_animation
    then:
      - lambda: |-
          ESP_LOGD("fan", "START_ANIMATION script called");

          if (id(fan_is_animating)) {
            ESP_LOGD("fan", "Animation already running, skipping");
            return;
          }

          auto img_widget = id(fan_state_image);
          lv_obj_t* img = img_widget;

          lv_anim_del(img, nullptr);
          lv_img_set_src(img, id(fan_green_image));

          int percentage = id(fan_current_percentage);
          if (percentage < 1) percentage = 100;

          int anim_time = (int)(3000.0 / (percentage / 33.0));
          if (anim_time < 500) anim_time = 500;
          if (anim_time > 5000) anim_time = 5000;

          // bool is_forward = id(fan_direction_sensor).state == "forward";
          bool is_forward = true;
          int start_angle = is_forward ? 0 : 3600;
          int end_angle = is_forward ? 3600 : 0;

          lv_anim_t anim_rotation;
          lv_anim_init(&anim_rotation);
          lv_anim_set_var(&anim_rotation, img);
          lv_anim_set_values(&anim_rotation, start_angle, end_angle);
          lv_anim_set_time(&anim_rotation, anim_time);
          lv_anim_set_repeat_count(&anim_rotation, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_exec_cb(&anim_rotation, [](void * var, int32_t v) {
            lv_img_set_angle((lv_obj_t*)var, v);
          });
          lv_anim_set_path_cb(&anim_rotation, lv_anim_path_linear);
          lv_anim_start(&anim_rotation);

          id(fan_is_animating) = true;

  - id: fan_stop_animation
    then:
      - lambda: |-
          ESP_LOGD("fan", "STOP_ANIMATION script called");

          auto img_widget = id(fan_state_image);
          lv_obj_t* img = img_widget;

          lv_anim_del(img, nullptr);
          lv_img_set_src(img, id(fan_misty_image));
          lv_img_set_angle(img, 0);

          id(fan_is_animating) = false;

  - id: fan_update_animation_speed
    then:
      - lambda: |-
          if (!id(fan_is_animating)) {
            return;
          }
          id(fan_is_animating) = false;
      - script.execute: fan_start_animation

  - id: fan_update_animation_direction
    then:
      - lambda: |-
          if (!id(fan_is_animating)) {
            return;
          }
          id(fan_is_animating) = false;
      - script.execute: fan_start_animation

  - id: fan_translations
    then:
      - lvgl.label.update:
          id: fan_state_label
          text: !lambda |-
            std::string key = "fan.state." + id(fan_state_sensor).state;
            return id(i18n_translations).translate(key);

