# fan_simplified.yaml

# This approach consolidates the logic for multiple fans using a single set of
# template sensors that switch based on the 'current_fan_index', similar to the thermostat.

substitutions: !include substitutions.yaml

globals:
  # 1. Global variables for friendly names
  - id: fan_name_1_stored
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: fan_name_2_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  # 2. Index tracking
  - id: current_fan_index
    type: int
    initial_value: '1'
    restore_value: no

  - id: current_fan_entity
    type: std::string
    restore_value: false
    initial_value: '"${fan_entity_1}"'

  # 3. Global states for the UI to read
  - id: fan_supported_features_stored
    type: int
    restore_value: no
    initial_value: '63'

  - id: fan_percentage_step
    type: float
    restore_value: no
    initial_value: '1.0'

  - id: fan_current_percentage
    type: int
    restore_value: no
    initial_value: '0'

  - id: fan_is_animating
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  ################################################################
  # CONSOLIDATED TEMPLATE SENSORS
  ################################################################

  # Template aggregator for percentage (speed)
  - platform: template
    id: fan_sensor_percentage
    internal: true
    lambda: |-
      auto get_percentage = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(fan_percentage_1).state;
          case 2: return id(fan_percentage_2).state;
          default: return {};
        }
      };
      return get_percentage(id(current_fan_index));
    on_value:
      - lambda: |-
          id(fan_current_percentage) = int(x);
      - lvgl.arc.update:
          id: fan_arc
          value: !lambda return int(x);
          clickable: true
          indicator:
            arc_color: color_green
      - lvgl.label.update:
          id: fan_percentage_label
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            return buf;
      - if:
          condition:
            lambda: 'return id(fan_state_sensor).state == "on";'
          then:
            - script.execute: fan_update_animation_speed

  # Template aggregator for percentage_step
  - platform: template
    id: fan_sensor_percentage_step
    internal: true
    lambda: |-
      auto get_step = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(fan_percentage_step_1).state;
          case 2: return id(fan_percentage_step_2).state;
          default: return {};
        }
      };
      return get_step(id(current_fan_index));
    on_value:
      - lambda: |-
          id(fan_percentage_step) = x;

  # Template aggregator for supported_features
  - platform: template
    id: fan_sensor_supported_features
    internal: true
    lambda: |-
      auto get_features = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(fan_supported_features_1).state;
          case 2: return id(fan_supported_features_2).state;
          default: return {};
        }
      };
      return get_features(id(current_fan_index));
    on_value:
      - lambda: |-
          ESP_LOGD("fan", "Supported features: %.0f", x);
          id(fan_supported_features_stored) = x;

          bool has_set_speed = (int(x) & 1) != 0;
          bool has_oscillate = (int(x) & 2) != 0;
          bool has_direction = (int(x) & 4) != 0;
          bool has_preset_mode = (int(x) & 8) != 0;

          // Arc visibility
          if (has_set_speed) {
            lv_obj_add_flag(id(fan_arc), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_clear_flag(id(fan_arc), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_clear_flag(id(fan_arc), LV_OBJ_FLAG_CLICKABLE);
            lv_obj_add_flag(id(fan_arc), LV_OBJ_FLAG_HIDDEN);
          }

          // Control buttons visibility
          //if (has_oscillate || has_direction) {
          //  lv_obj_clear_flag(id(fan_oscillating_btn_bg), LV_OBJ_FLAG_HIDDEN);
          //  lv_obj_clear_flag(id(fan_direction_btn_bg), LV_OBJ_FLAG_HIDDEN);

          //  if (has_oscillate) {
          //    lv_obj_add_flag(id(fan_oscillating_btn), LV_OBJ_FLAG_CLICKABLE);
          //    lv_obj_set_style_text_color(id(fan_oscillating_btn_icon), lv_color_hex(0x9DB4C0), 0);
          //  } else {
          //    lv_obj_clear_flag(id(fan_oscillating_btn), LV_OBJ_FLAG_CLICKABLE);
          //    lv_obj_set_style_text_color(id(fan_oscillating_btn_icon), lv_color_hex(0x3D5A6C), 0);
          //  }

          //  if (has_direction) {
          //    lv_obj_add_flag(id(fan_direction_btn), LV_OBJ_FLAG_CLICKABLE);
          //    lv_obj_set_style_text_color(id(fan_direction_btn_icon), lv_color_hex(0x9DB4C0), 0);
          //  } else {
          //    lv_obj_clear_flag(id(fan_direction_btn), LV_OBJ_FLAG_CLICKABLE);
          //    lv_obj_set_style_text_color(id(fan_direction_btn_icon), lv_color_hex(0x3D5A6C), 0);
          //  }
          //} else {
          //  lv_obj_add_flag(id(fan_oscillating_btn_bg), LV_OBJ_FLAG_HIDDEN);
          //  lv_obj_add_flag(id(fan_direction_btn_bg), LV_OBJ_FLAG_HIDDEN);
          //}

          // Preset mode button
          // if (has_preset_mode) {
          //   lv_obj_clear_flag(id(fan_controls_presets), LV_OBJ_FLAG_HIDDEN);
          // } else {
          //   lv_obj_add_flag(id(fan_controls_presets), LV_OBJ_FLAG_HIDDEN);
          // }

  ################################################################
  # INDIVIDUAL HA SENSORS
  ################################################################

  # Fan 1 Sensors
  - platform: homeassistant
    id: fan_percentage_1
    entity_id: "${fan_entity_1}"
    attribute: percentage
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_fan_index) == 1;'
          then:
            - sensor.template.publish:
                id: fan_sensor_percentage
                state: !lambda 'return x;'

  - platform: homeassistant
    id: fan_percentage_step_1
    entity_id: "${fan_entity_1}"
    attribute: percentage_step
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_fan_index) == 1;'
          then:
            - sensor.template.publish:
                id: fan_sensor_percentage_step
                state: !lambda 'return x;'

  - platform: homeassistant
    id: fan_supported_features_1
    entity_id: "${fan_entity_1}"
    attribute: supported_features
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_fan_index) == 1;'
          then:
            - sensor.template.publish:
                id: fan_sensor_supported_features
                state: !lambda 'return x;'

  # Fan 2 Sensors
  - platform: homeassistant
    id: fan_percentage_2
    entity_id: "${fan_entity_2}"
    attribute: percentage
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_fan_index) == 2;'
          then:
            - sensor.template.publish:
                id: fan_sensor_percentage
                state: !lambda 'return x;'

  - platform: homeassistant
    id: fan_percentage_step_2
    entity_id: "${fan_entity_2}"
    attribute: percentage_step
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_fan_index) == 2;'
          then:
            - sensor.template.publish:
                id: fan_sensor_percentage_step
                state: !lambda 'return x;'

  - platform: homeassistant
    id: fan_supported_features_2
    entity_id: "${fan_entity_2}"
    attribute: supported_features
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_fan_index) == 2;'
          then:
            - sensor.template.publish:
                id: fan_sensor_supported_features
                state: !lambda 'return x;'

text_sensor:
  ################################################################
  # CONSOLIDATED TEMPLATE TEXT SENSORS
  ################################################################

  # Template aggregator for state (on/off)
  - platform: template
    id: fan_state_sensor
    internal: true
    lambda: |-
      auto get_state = [&](int idx) -> std::string {
        switch (idx) {
          case 1: return id(fan_state_sensor_1).state;
          case 2: return id(fan_state_sensor_2).state;
          default: return "";
        }
      };
      return get_state(id(current_fan_index));
    on_value:
      - script.execute: fan_translations
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.obj.update:
                id: fan_state_image_bg
                bg_color: color_green
            - script.execute: fan_start_animation
          else:
            - lvgl.obj.update:
                id: fan_state_image_bg
                bg_color: color_misty_blue
            - script.execute: fan_stop_animation

