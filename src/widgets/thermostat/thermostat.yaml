  # Aggregators for state, action, modes, presets (using lambda helpers)
  - platform: template
    id: thermostat_sensor_state
    internal: true
    lambda: |-
      auto get_state = [&](int idx) -> std::string {
        switch (idx) {
          case 1: return id(thermostat_sensor_state_1).state;
          case 2: return id(thermostat_sensor_state_2).state;
          case 3: return id(thermostat_sensor_state_3).state;
          case 4: return id(thermostat_sensor_state_4).state;
          default: return "";
        }
      };
      return get_state(id(current_climate_index));
    on_value:
      - wait_until:
          condition:
            lambda: 'return id(thermostat_arc_range_initialized);'
          timeout: 5s
      - script.execute: thermostat_handle_state_change

  - platform: template
    id: thermostat_sensor_hvac_action
    internal: true
    lambda: |-
      auto get_action = [&](int idx) -> std::string {
        switch (idx) {
          case 1: return id(thermostat_sensor_hvac_action_1).state;
          case 2: return id(thermostat_sensor_hvac_action_2).state;
          case 3: return id(thermostat_sensor_hvac_action_3).state;
          case 4: return id(thermostat_sensor_hvac_action_4).state;
          default: return "";
        }
      };
      return get_action(id(current_climate_index));
    on_value:
      - wait_until:
          condition:
            lambda: 'return id(thermostat_arc_range_initialized);'
          timeout: 5s
      - lvgl.label.update:
          id: thermostat_state_label
          text: !lambda |-
            std::string s = x;
            if (!s.empty()) {
              s[0] = (char)toupper((unsigned char)s[0]);
            }
            return s;
          text_color: !lambda |-
            std::string a = x;
            for (auto &c : a) c = (char)tolower((unsigned char)c);
            if (a == "heating")      return color_red;
            if (a == "idle")         return color_misty_blue;
            if (a == "off")          return color_steel_blue;
            // fallback
            return color_steel_blue;

  - platform: template
    id: thermostat_hvac_modes
    internal: true
    lambda: |-
