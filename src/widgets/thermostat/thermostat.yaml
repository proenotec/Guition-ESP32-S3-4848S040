      bg_color: color_slate_blue_gray
      on_load:
        - script.execute:
            id: set_active_page
            page_name: "therm_page"
        - script.execute:
            id: cycle_climate
            position: 1
        - lambda: |-
            int num_climates = ${climates_amount};
            if (num_climates >= 2) {
              lv_obj_clear_flag(id(thermo_select_widget), LV_OBJ_FLAG_HIDDEN);
            }
        # Optional: Add a short delay if needed for smooth transitions
