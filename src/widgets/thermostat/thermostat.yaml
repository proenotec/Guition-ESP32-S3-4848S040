    attribute: friendly_name
    on_value:
      - lambda: |-
          id(thermostat_name_1_stored) = x;
          ESP_LOGD("thermostat_name", "Stored thermostat 1 name: %s", x.c_str());
      - if:
          condition:
            lambda: 'return id(current_climate_index) == 1;'
          then:
