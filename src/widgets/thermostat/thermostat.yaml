            width: 240
            height: 480
            align: right_mid
            pad_all: 0
            bg_opa: transp
            scrollable: false
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            widgets:
              # Outer ring
              - obj:
                  x: 240
                  width: 480
                  height: 480
                  scrollable: false
                  align: right_mid
                  pad_all: 0
                  bg_opa: transp
                  shadow_opa: transp
                  border_opa: transp
                  border_width: 0
                  widgets:
                    - obj:
                        width: 460
                        height: 460
                        align: center
                        clickable: true
                        radius: 260
                        bg_color: color_slate_blue_gray
                        border_color: color_black
                        border_opa: 40%
                        border_width: 3

              # Inner elements (arcs)
              - obj:
                  x: 240
                  width: 480
                  height: 480
                  align: right_mid
                  pad_all: 0
                  bg_opa: transp
                  shadow_opa: transp
                  border_opa: transp
                  border_width: 0
                  widgets:
                    - obj:
                        width: 366
                        height: 366
                        align: center
                        clickable: false
                        radius: 230
                        bg_color: color_slate_blue_gray
                        border_color: color_white
                        border_width: 3
                        border_opa: 15%

                    # Background arc
                    - arc:
                        id: thermostat_arc_background
                        clickable: false
                        adjustable: false
                        adv_hittest: false
                        align: center
                        width: 444
                        height: 444
                        start_angle: 0
                        end_angle: 180
                        min_value: 70
                        max_value: 350
                        value: 265
                        arc_width: 34
                        rotation: 90.0
                        arc_color: color_steel_blue
                        indicator:
                          arc_opa: transp
                          arc_width: 34

                    # Current temp arc
                    - arc:
                        id: thermostat_arc_current_temperature
                        clickable: false
                        adjustable: true
                        adv_hittest: true
                        align: center
                        width: 444
                        height: 444
                        start_angle: 0
                        end_angle: 180
                        min_value: 70
                        max_value: 350
                        value: 265
                        arc_width: 34
                        rotation: 90.0
                        arc_opa: transp
                        indicator:
                          arc_opa: transp
                          arc_width: 34
                        knob:
                          pad_all: -12
                          bg_color: color_steel_blue

                    # Knob arc
                    - arc:
                        id: thermostat_arc_knob
                        clickable: true
                        adjustable: true
                        adv_hittest: true
                        align: center
                        width: 444
                        height: 444
                        start_angle: 0
                        end_angle: 180
                        min_value: 70
                        max_value: 350
                        value: 265
                        arc_width: 34
                        rotation: 90.0
                        arc_opa: transp
                        indicator:
                          arc_opa: transp
                          arc_width: 34
                        knob:
                          pad_all: 0
                          bg_color: color_white
                          border_color: color_steel_blue
                          border_width: 4
                          shadow_color: color_black
                          shadow_spread: 2
                          shadow_width: 13
                          shadow_opa: 30%
                        on_value:
                          - lambda: |-
                              if (!id(thermostat_ui_user_adjusting_target))
                                id(thermostat_ui_user_adjusting_target) = true;
                              int m = id(thermostat_temp_step_multiplier);
                              float temp = x / (float)m;
                              int scaled = (int)(temp * m + 0.5f);
                              int whole = scaled / m;
                              int frac = ((scaled * 10) / m) % 10;
                              char wbuf[8], fbuf[8];
                              snprintf(wbuf, sizeof(wbuf), "%d", whole);
                              snprintf(fbuf, sizeof(fbuf), ".%d", frac);
                              lv_label_set_text(id(thermostat_target_temperature_whole), wbuf);
                              lv_label_set_text(id(thermostat_target_temperature_fraction), fbuf);
                        on_release:
                          - homeassistant.action:
                              action: climate.set_temperature
                              data:
                                entity_id: !lambda 'return id(current_climate_entity);'
                                temperature: !lambda return x / (float)id(thermostat_temp_step_multiplier);

                    # Heat base arc
                    - arc:
                        id: thermostat_arc_base_heat
                        adjustable: true
                        adv_hittest: true
                        align: center
                        width: 444
                        height: 444
                        start_angle: 0
                        end_angle: 180
                        min_value: 70
                        max_value: 350
                        value: 265
                        arc_width: 34
                        rotation: 90.0
                        arc_opa: transp
                        indicator:
                          arc_color: color_deep_orange
                          arc_width: 34
                        knob:
                          pad_all: -1
                          bg_color: color_white
                          border_color: color_red
                          border_width: 4
                          shadow_color: color_black
                        on_value:
                          - lambda: |-
                              if (id(thermostat_sensor_state).state == "heat") {
                                if (!id(thermostat_ui_user_adjusting_target))
                                  id(thermostat_ui_user_adjusting_target) = true;
                                lv_arc_set_value(id(thermostat_arc_knob_heat), x);
                                float temp = x / (float)id(thermostat_temp_step_multiplier);
                                int scaled = (int)(temp * id(thermostat_temp_step_multiplier) + 0.5f);
                                int whole = scaled / id(thermostat_temp_step_multiplier);
                                int frac = ((scaled * 10) / id(thermostat_temp_step_multiplier)) % 10;
                                char wbuf[8], fbuf[8];
                                snprintf(wbuf, sizeof(wbuf), "%d", whole);
                                snprintf(fbuf, sizeof(fbuf), ".%d", frac);
                                lv_label_set_text(id(thermostat_target_temperature_whole), wbuf);
                                lv_label_set_text(id(thermostat_target_temperature_fraction), fbuf);
                                id(thermostat_update_segments).execute();
                              }
                        on_release:
                          - lambda: |-
                              id(thermostat_ui_user_adjusting_target) = false;
                          - if:
                              condition:
                                lambda: 'return id(thermostat_sensor_state).state == "heat";'
                              then:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: !lambda 'return id(current_climate_entity);'
                                      temperature: !lambda 'return lv_arc_get_value(id(thermostat_arc_base_heat)) / (float)id(thermostat_temp_step_multiplier);'

                    # Heat segment
                    - arc:
                        id: thermostat_arc_segment_heat
                        clickable: false
                        adjustable: false
                        adv_hittest: false
                        align: center
                        width: 444
                        height: 444
                        start_angle: 90
                        end_angle: 100
                        min_value: 0
                        max_value: 100
                        value: 100
                        arc_width: 34
                        rotation: 90.0
                        arc_opa: transp
                        indicator:
                          arc_color: color_red
                          arc_width: 34
                        knob:
                          bg_opa: transp

                    # Heat dot
                    - arc:
                        id: thermostat_arc_dot_heat
                        clickable: false
                        adjustable: true
                        adv_hittest: true
                        align: center
                        width: 444
                        height: 444
                        start_angle: 0
                        end_angle: 180
                        min_value: 70
                        max_value: 350
                        value: 265
                        arc_width: 34
                        rotation: 90.0
                        arc_opa: transp
                        indicator:
                          arc_opa: transp
                          arc_width: 34
                        knob:
                          pad_all: -12
                          bg_color: color_deep_orange

                    # Heat knob
                    - arc:
                        id: thermostat_arc_knob_heat
                        align: center
                        width: 444
                        height: 444
                        start_angle: 0
                        end_angle: 180
                        rotation: 90.0
