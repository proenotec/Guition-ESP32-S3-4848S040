# https://esphome.io/components/climate/climate.html

substitutions: !include substitutions.yaml

globals:

  # NEW: Global variables for friendly names
  - id: thermostat_name_1_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: thermostat_name_2_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: thermostat_name_3_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: thermostat_name_4_stored
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: current_climate_index
    type: int
    initial_value: '1'
    restore_value: no

  - id: current_climate_entity
    type: std::string
    restore_value: false
    initial_value: '"${thermo_entity_1}"'

  - id: thermostat_arc_range_initialized
    type: bool
    initial_value: "false"
    restore_value: no

  - id: thermostat_ui_user_adjusting_target
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: thermostat_temp_step
    type: float
    initial_value: "0.1"
    restore_value: no

  - id: thermostat_temp_step_multiplier
    type: int
    initial_value: '10'
    restore_value: no

# ============================================================
# thermostat.yaml - SUSCRIPTOR
# ============================================================

sensor:
  - platform: template
    id: thermostat_door_window_subscriber
    internal: true
    # NO LAMBDA - se actualiza via publish_state()
    on_value:
      - lambda: |-
          ESP_LOGD("thermostat_sub", "🔔 Event received! Counter: %.0f", x);
          ESP_LOGD("thermostat_sub", "   Page: %s, Source: %s",
                   id(active_lvgl_page).c_str(), id(last_event_source).c_str());
      - if:
          condition:
            lambda: 'return id(active_lvgl_page) == "therm_page";'
          then:
            - logger.log: "✅ Calling update_thermostat_window_display"
            - script.execute: update_thermostat_window_display
          else:
            - logger.log: "⚠️ Not on therm_page, ignoring"

  - platform: template
    id: thermostat_hvac_subscriber
    internal: true
    on_value:
      - lambda: |-
          ESP_LOGD("thermostat_hvac", "🔔 HVAC event! Counter: %.0f", x);
      - if:
          condition:
            lambda: 'return id(active_lvgl_page) == "therm_page";'
          then:
            - logger.log: "✅ Handling HVAC event"

  # Template aggregators for shared UI updates (reactive to specific sensor changes when index matches)
  - platform: template
    id: thermostat_sensor_target_temp
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      auto get_temp = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(thermostat_sensor_target_temp_1).state;
          case 2: return id(thermostat_sensor_target_temp_2).state;
          case 3: return id(thermostat_sensor_target_temp_3).state;
          case 4: return id(thermostat_sensor_target_temp_4).state;
          default: return {};
        }
      };
      return get_temp(id(current_climate_index));
    on_value:
      - script.execute: thermostat_update_target_display

  - platform: template
    id: thermostat_sensor_current_temp
    internal: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      auto get_temp = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(thermostat_sensor_current_temp_1).state;
          case 2: return id(thermostat_sensor_current_temp_2).state;
          case 3: return id(thermostat_sensor_current_temp_3).state;
          case 4: return id(thermostat_sensor_current_temp_4).state;
          default: return {};
        }
      };
      return get_temp(id(current_climate_index));
    on_value:
      - wait_until:
          condition:
            lambda: 'return id(thermostat_arc_range_initialized);'
          timeout: 5s
      - script.execute: thermostat_update_segments
      - lvgl.arc.update:
          id: thermostat_arc_current_temperature
          value: !lambda 'return (int)(x * id(thermostat_temp_step_multiplier) + 0.5f);'
      - lvgl.label.update:
          id: thermostat_current_temperature_label
          text: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%.1f", x);
            return std::string(buf);

  - platform: template
    id: thermostat_sensor_min_temp
    internal: true
    lambda: |-
      auto get_temp = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(thermostat_sensor_min_temp_1).state;
          case 2: return id(thermostat_sensor_min_temp_2).state;
          case 3: return id(thermostat_sensor_min_temp_3).state;
          case 4: return id(thermostat_sensor_min_temp_4).state;
          default: return {};
        }
      };
      return get_temp(id(current_climate_index));
    on_value:
      - script.execute: thermostat_update_arc_temp_range

  - platform: template
    id: thermostat_sensor_max_temp
    internal: true
    lambda: |-
      auto get_temp = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(thermostat_sensor_max_temp_1).state;
          case 2: return id(thermostat_sensor_max_temp_2).state;
          case 3: return id(thermostat_sensor_max_temp_3).state;
          case 4: return id(thermostat_sensor_max_temp_4).state;
          default: return {};
        }
      };
      return get_temp(id(current_climate_index));
    on_value:
      - script.execute: thermostat_update_arc_temp_range

  - platform: template
    id: thermostat_sensor_target_temp_step
    internal: true
    lambda: |-
      auto get_step = [&](int idx) -> optional<float> {
        switch (idx) {
          case 1: return id(thermostat_sensor_target_temp_step_1).state;
          case 2: return id(thermostat_sensor_target_temp_step_2).state;
          case 3: return id(thermostat_sensor_target_temp_step_3).state;
          case 4: return id(thermostat_sensor_target_temp_step_4).state;
          default: return {};
        }
      };
      return get_step(id(current_climate_index));
    on_value:
      - lambda: |-
          float raw = x;
          float chosen = 0.5f;
          int m = 2;
          auto near = [](float a, float b)->bool { return fabsf(a-b) < 0.049f; };
          if (near(raw,0.1f)) { chosen = 0.1f; m = 10; }
          else if (near(raw,0.5f)) { chosen = 0.5f; m = 2; }
          else if (near(raw,1.0f)) { chosen = 1.0f; m = 1; }
          else { chosen = 0.5f; m = 2; }
          id(thermostat_temp_step) = chosen;
          id(thermostat_temp_step_multiplier) = m;
          ESP_LOGD("ARC_STEP","target_temp_step=%.3f -> multiplier=%d", chosen, m);
          if (id(thermostat_arc_range_initialized)) {
            id(thermostat_arc_range_initialized) = false;
            id(thermostat_update_arc_temp_range).execute();
          }

  # Individual HA sensors for each climate (consolidated on_value to publish only if active)
  - platform: homeassistant
    id: thermostat_sensor_target_temp_1
    entity_id: "${thermo_entity_1}"
    attribute: temperature
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(current_climate_index) == 1;'
          then:
