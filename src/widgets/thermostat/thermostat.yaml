            border_opa: transp
            widgets:
              # Window status label (NUEVO)
              - label:
                  id: thermostat_window_label
                  align: center
                  text_font: mdi_icons_24
                  text_color: color_misty_blue
                  text: "\U000F11DB"


        # Minus button
        - obj:
            x: 150
            y: 100
            width: 90
            height: 90
            align: left_mid
            pad_all: 0
            bg_opa: transp
            shadow_opa: transp
            border_opa: transp
            widgets:
              - obj:
                  width: 70
                  height: 70
                  align: center
                  clickable: true
                  radius: 50
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  border_width: 0
                  shadow_width: 8
                  shadow_spread: 2
                  shadow_color: color_black
                  pressed:
                    bg_color: 0x3A3A4C
                    shadow_width: 5
                  on_press:
                    - script.execute:
                        id: thermostat_adjust_temp
                        direction: down
              - obj:
                  width: 60
                  height: 60
                  align: center
                  clickable: false
                  radius: 45
                  pad_all: 0
                  bg_opa: transp
                  border_opa: transp
                  shadow_width: 4
                  shadow_color: 0xFFFFFF
                  shadow_ofs_x: -4
                  shadow_ofs_y: -2
                  shadow_opa: 30%
              - obj:
                  width: 65
                  height: 65
                  pad_all: 0
                  align: center
                  clickable: false
                  radius: 50
                  border_opa: transp
                  bg_color: color_slate_blue_gray
                  widgets:
                    - label:
                        id: thermostat_minus_label
                        align: CENTER
                        text_font: mdi_icons_40
                        text_color: color_misty_blue
                        text: "${minus_icon}"

        # Back
        - obj:
            x: 150
            y: 0
            width: 80
            height: 70
            align: bottom_left
            bg_opa: transp
            pad_all: 0
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 0
            widgets:
              - obj:
                  y: -20
                  width: 80
                  height: 5
                  align: bottom_mid
                  bg_color: color_steel_blue
                  pad_all: 0
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  radius: 15
            on_click:
              - script.execute:
                  id: page_cleanup
                  page_name: "therm_page"
              - lambda: |-
                  lv_obj_add_flag(id(thermo_select_widget), LV_OBJ_FLAG_HIDDEN);
              - lvgl.page.show: home_page

#on_some_event:
#  then:
#    - if:
#        condition:
#          lvgl.page.is_showing: therm_page
#        then:
#          - lambda: |-
#              int num_climates = ${climates_amount};
#              if (num_climates >= 2) {
#                lv_obj_clear_flag(id(thermo_select_widget), LV_OBJ_FLAG_HIDDEN);
#              }
#          # Optional: Add a short delay if needed for smooth transitions
#          # - delay: 250ms  # Uncomment if you see flickering

script:
  # Consolidated state handler (replaces repeated if-blocks)
  - id: thermostat_handle_state_change
    then:
      - lambda: |-
          std::string state = id(thermostat_sensor_state).state;
          bool is_heat = (state == "heat");
          bool is_off = (state == "off");

          // Show/hide widgets based on mode
          lv_obj_clear_flag(id(thermostat_target_temperature_single), LV_OBJ_FLAG_HIDDEN);

          if (is_heat) {
            lv_obj_add_flag(id(thermostat_arc_background), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(thermostat_arc_knob), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(thermostat_arc_base_heat), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(thermostat_arc_segment_heat), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(thermostat_arc_dot_heat), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(thermostat_arc_knob_heat), LV_OBJ_FLAG_HIDDEN);

            // Update colors and arcs for heat
            lv_obj_set_style_text_color(id(thermostat_target_temperature_whole), color_deep_orange, 0);
            lv_obj_set_style_text_color(id(thermostat_target_temperature_fraction), color_deep_orange, 0);
            lv_obj_set_style_text_color(id(thermostat_target_temperature_measurement), color_deep_orange, 0);
            lv_obj_set_style_text_color(id(thermostat_heat_mode_label), color_deep_orange, 0);

            int m = id(thermostat_temp_step_multiplier);
            int target_scaled = (int)(id(thermostat_sensor_target_temp).state * m + 0.5f);
            lv_arc_set_value(id(thermostat_arc_base_heat), target_scaled);
            lv_arc_set_value(id(thermostat_arc_knob_heat), target_scaled);

            id(thermostat_ui_user_adjusting_target) = false;
          } else {
            lv_obj_clear_flag(id(thermostat_arc_background), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(thermostat_arc_knob), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(thermostat_arc_base_heat), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(thermostat_arc_segment_heat), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(thermostat_arc_dot_heat), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(thermostat_arc_knob_heat), LV_OBJ_FLAG_HIDDEN);

            lv_arc_set_value(id(thermostat_arc_background), lv_arc_get_max_value(id(thermostat_arc_background)));

            int m = id(thermostat_temp_step_multiplier);
            if (id(thermostat_sensor_target_temp).has_state()) {
              int target_scaled = (int)(id(thermostat_sensor_target_temp).state * m + 0.5f);
              lv_arc_set_value(id(thermostat_arc_knob), target_scaled);
            }
            if (id(thermostat_sensor_current_temp).has_state()) {
              int current_scaled = (int)(id(thermostat_sensor_current_temp).state * m + 0.5f);
              lv_arc_set_value(id(thermostat_arc_current_temperature), current_scaled);
            }

            id(thermostat_ui_user_adjusting_target) = false;
          }

          if (is_off) {
            // Off-specific colors
            lv_obj_set_style_arc_color(id(thermostat_arc_background), color_misty_blue, 0);
            lv_obj_set_style_border_color(id(thermostat_arc_knob), color_misty_blue, LV_PART_KNOB);
            lv_obj_set_style_text_color(id(thermostat_target_temperature_whole), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(thermostat_target_temperature_fraction), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(thermostat_target_temperature_measurement), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(thermostat_heat_mode_label), color_misty_blue, 0);
          }

          id(thermostat_update_active_arc_layer).execute();
          id(thermostat_update_segments).execute();
          id(thermostat_update_adjust_buttons_color).execute();

  - id: thermostat_update_target_display
    then:
      - lambda: |-
          float t = id(thermostat_sensor_target_temp).state;
          int m = id(thermostat_temp_step_multiplier);
          int scaled = (int)(t * m + 0.5f);
          int whole = scaled / m;
          int frac_digit = ((scaled * 10) / m) % 10;
          char buf_whole[10], buf_frac[10];
          snprintf(buf_whole, sizeof(buf_whole), "%d", whole);
          snprintf(buf_frac, sizeof(buf_frac), ".%01d", frac_digit);
          lv_label_set_text(id(thermostat_target_temperature_whole), buf_whole);
          lv_label_set_text(id(thermostat_target_temperature_fraction), buf_frac);
      - if:
          condition:
            lambda: 'return id(thermostat_sensor_state).state == "heat";'
          then:
            - lvgl.arc.update:
                id: thermostat_arc_base_heat
                value: !lambda 'return (int)(id(thermostat_sensor_target_temp).state * id(thermostat_temp_step_multiplier) + 0.5f);'
            - script.execute: thermostat_update_segments

  - id: thermostat_update_preset_colors
    then:
      - lambda: |-
          std::string preset = id(thermostat_preset_mode).state;
          // Reset all to misty_blue
          lv_obj_set_style_text_color(id(thermostat_eco_preset_label), color_misty_blue, 0);
          lv_obj_set_style_text_color(id(thermostat_home_preset_label), color_misty_blue, 0);
          lv_obj_set_style_text_color(id(thermostat_away_preset_label), color_misty_blue, 0);
          lv_obj_set_style_text_color(id(thermostat_comfort_preset_label), color_misty_blue, 0);
          lv_obj_set_style_text_color(id(thermostat_sleep_preset_label), color_misty_blue, 0);
          lv_obj_set_style_text_color(id(thermostat_activity_preset_label), color_misty_blue, 0);

          // Highlight active
          if (preset == "none") return;
          if (preset == "eco") lv_obj_set_style_text_color(id(thermostat_eco_preset_label), color_green, 0);
          else if (preset == "home") lv_obj_set_style_text_color(id(thermostat_home_preset_label), color_blue, 0);
          else if (preset == "away") lv_obj_set_style_text_color(id(thermostat_away_preset_label), color_orange, 0);
          else if (preset == "comfort") lv_obj_set_style_text_color(id(thermostat_comfort_preset_label), color_yellow, 0);
          else if (preset == "sleep") lv_obj_set_style_text_color(id(thermostat_sleep_preset_label), color_dark_blue, 0);
          else if (preset == "activity") lv_obj_set_style_text_color(id(thermostat_activity_preset_label), color_crimson, 0);

  # New consolidated adjust temp script
  - id: thermostat_adjust_temp
    parameters:
      direction: string  # "up" or "down"
    then:
      - lambda: |-
          std::string mode = id(thermostat_sensor_state).state;
          float step = id(thermostat_temp_step);
          int m = id(thermostat_temp_step_multiplier);
          float min_t = id(thermostat_sensor_min_temp).has_state() ? id(thermostat_sensor_min_temp).state : 5.0f;
          float max_t = id(thermostat_sensor_max_temp).has_state() ? id(thermostat_sensor_max_temp).state : 35.0f;
          float cur = id(thermostat_sensor_target_temp).has_state() ? id(thermostat_sensor_target_temp).state : 0.0f;

          if (direction == "up") cur += step;
          else cur -= step;
          if (cur < min_t) cur = min_t;
          if (cur > max_t) cur = max_t;

          int cur_scaled = (int)roundf(cur * m);
          if (mode == "heat") {
            lv_arc_set_value(id(thermostat_arc_base_heat), cur_scaled);
            lv_arc_set_value(id(thermostat_arc_knob_heat), cur_scaled);
            id(thermostat_update_segments).execute();
          } else {
            lv_arc_set_value(id(thermostat_arc_knob), cur_scaled);
            int whole = cur_scaled / m;
            int frac = ((cur_scaled * 10) / m) % 10;
            char wbuf[8], fbuf[8];
            snprintf(wbuf, sizeof(wbuf), "%d", whole);
            snprintf(fbuf, sizeof(fbuf), ".%d", frac);
            lv_label_set_text(id(thermostat_target_temperature_whole), wbuf);
            lv_label_set_text(id(thermostat_target_temperature_fraction), fbuf);
          }

      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda 'return id(current_climate_entity);'
            temperature: !lambda |-
              std::string mode = id(thermostat_sensor_state).state;
              int m = id(thermostat_temp_step_multiplier);
              if (mode == "heat") {
                return lv_arc_get_value(id(thermostat_arc_base_heat)) / (float)m;
              } else {
                return lv_arc_get_value(id(thermostat_arc_knob)) / (float)m;
              }

      - lambda: 'id(thermostat_ui_user_adjusting_target) = false;'
      - script.execute: thermostat_update_segments
      - script.execute: thermostat_update_adjust_buttons_color

  # Cycle climate (uses substitutions for arrays)
  - id: cycle_climate
    parameters:
      position: int
    then:
      - lambda: |-
          const char* entities[] = {"${thermo_entity_1}", "${thermo_entity_2}", "${thermo_entity_3}", "${thermo_entity_4}"};

          const int num = ${climates_amount};
          if (position > 0 && position <= num) {
            id(current_climate_index) = position;
            id(current_climate_entity) = entities[position - 1];

            // NEW: Update friendly name label from stored globals
            std::string name = "";
            switch (position) {
              case 1: name = id(thermostat_name_1_stored); break;
              case 2: name = id(thermostat_name_2_stored); break;
              case 3: name = id(thermostat_name_3_stored); break;
              case 4: name = id(thermostat_name_4_stored); break;
              default: name = "Thermostat";
            }
            if (!name.empty()) {
              lv_label_set_text(id(thermostat_name_label), name.c_str());
            }
            ESP_LOGD("climate_cycle", "Switched to: %s (%s)", name.c_str(), entities[position - 1]);

            // Reset all button backgrounds to transparent
            lv_obj_set_style_bg_opa(id(climate_btn_1), LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(id(climate_btn_2), LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(id(climate_btn_3), LV_OPA_TRANSP, 0);
            lv_obj_set_style_bg_opa(id(climate_btn_4), LV_OPA_TRANSP, 0);

            // Reset all icon colors to misty_blue
            lv_obj_set_style_text_color(id(thermo_icon_1), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(thermo_icon_2), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(thermo_icon_3), color_misty_blue, 0);
            lv_obj_set_style_text_color(id(thermo_icon_4), color_misty_blue, 0);

            // Highlight the selected button
            switch (position) {
              case 1:
                lv_obj_set_style_bg_opa(id(climate_btn_1), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(climate_btn_1), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(thermo_icon_1), color_white, 0);
                break;
              case 2:
                lv_obj_set_style_bg_opa(id(climate_btn_2), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(climate_btn_2), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(thermo_icon_2), color_white, 0);
                break;
              case 3:
                lv_obj_set_style_bg_opa(id(climate_btn_3), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(climate_btn_3), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(thermo_icon_3), color_white, 0);
                break;
              case 4:
                lv_obj_set_style_bg_opa(id(climate_btn_4), LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(id(climate_btn_4), color_steel_blue, 0);
                lv_obj_set_style_text_color(id(thermo_icon_4), color_white, 0);
                break;
            }
          }
      - script.execute: thermostat_cycle_refresh

  - id: update_thermostat_window_display
    then:
      - lambda: |-
          // Obtener el índice actual
          int idx = id(current_climate_index);

          ESP_LOGD("thermostat", "update_thermostat_window_display for index %d", idx);

          bool window_state = false;
          int window_icon_idx = 0;

          // Obtener estado según el termostato activo
          switch(idx) {
            case 1: // Salón
              window_state = id(salon_windows).state;
              break;
            case 2: // Baño
              window_state = id(bathroom_window).state;
              break;
            case 3: // Dormitorio
              window_state = id(maindorm_window).state;
              break;
            case 4: // Pasillo
              window_state = id(maindoor_status).state;
              break;
          }

          // Actualizar icono y color
          if (window_state) {
            lv_obj_set_style_text_color(id(thermostat_window_label), lv_color_hex(0xFF6B35), 0); // naranja
            window_icon_idx = 1; // abierta
          } else {
            lv_obj_set_style_text_color(id(thermostat_window_label), lv_color_hex(0x9E9E9E), 0); // gris
            window_icon_idx = 0; // cerrada
          }

          // Array de iconos de ventana
          static const char* window_icons[] = {"\U000F11DB", "\U000F11DC"}; // cerrada, abierta

          lv_label_set_text(id(thermostat_window_label), window_icons[window_icon_idx]);

  - id: thermostat_cycle_refresh
    then:
      - delay: 500ms
      - lambda: |-
          int idx = id(current_climate_index);
          ESP_LOGD("CYCLE_REFRESH", "Manually publishing templates for index %d", idx);

          // Target temp
          {
            optional<float> val;
            switch (idx) {
              case 1: val = id(thermostat_sensor_target_temp_1).state; break;
              case 2: val = id(thermostat_sensor_target_temp_2).state; break;
              case 3: val = id(thermostat_sensor_target_temp_3).state; break;
              case 4: val = id(thermostat_sensor_target_temp_4).state; break;
            }
            if (val.has_value()) {
              id(thermostat_sensor_target_temp).publish_state(val.value());
            }
          }

          // Current temp
          {
            optional<float> val;
            switch (idx) {
              case 1: val = id(thermostat_sensor_current_temp_1).state; break;
              case 2: val = id(thermostat_sensor_current_temp_2).state; break;
              case 3: val = id(thermostat_sensor_current_temp_3).state; break;
              case 4: val = id(thermostat_sensor_current_temp_4).state; break;
            }
            if (val.has_value()) {
              id(thermostat_sensor_current_temp).publish_state(val.value());
            }
          }

          // Min temp
          {
            optional<float> val;
            switch (idx) {
              case 1: val = id(thermostat_sensor_min_temp_1).state; break;
              case 2: val = id(thermostat_sensor_min_temp_2).state; break;
              case 3: val = id(thermostat_sensor_min_temp_3).state; break;
              case 4: val = id(thermostat_sensor_min_temp_4).state; break;
            }
            if (val.has_value()) {
              id(thermostat_sensor_min_temp).publish_state(val.value());
            }
          }

          // Max temp
          {
            optional<float> val;
            switch (idx) {
              case 1: val = id(thermostat_sensor_max_temp_1).state; break;
              case 2: val = id(thermostat_sensor_max_temp_2).state; break;
              case 3: val = id(thermostat_sensor_max_temp_3).state; break;
              case 4: val = id(thermostat_sensor_max_temp_4).state; break;
            }
            if (val.has_value()) {
              id(thermostat_sensor_max_temp).publish_state(val.value());
            }
          }

          // Target temp step
          {
            optional<float> val;
            switch (idx) {
              case 1: val = id(thermostat_sensor_target_temp_step_1).state; break;
              case 2: val = id(thermostat_sensor_target_temp_step_2).state; break;
              case 3: val = id(thermostat_sensor_target_temp_step_3).state; break;
              case 4: val = id(thermostat_sensor_target_temp_step_4).state; break;
            }
            if (val.has_value()) {
              id(thermostat_sensor_target_temp_step).publish_state(val.value());
            }
          }

          // HVAC state
          {
            std::string val;
            switch (idx) {
              case 1: val = id(thermostat_sensor_state_1).state; break;
              case 2: val = id(thermostat_sensor_state_2).state; break;
              case 3: val = id(thermostat_sensor_state_3).state; break;
              case 4: val = id(thermostat_sensor_state_4).state; break;
            }
            if (!val.empty()) {
              id(thermostat_sensor_state).publish_state(val);
            }
          }

          // HVAC action
          {
            std::string val;
            switch (idx) {
              case 1: val = id(thermostat_sensor_hvac_action_1).state; break;
              case 2: val = id(thermostat_sensor_hvac_action_2).state; break;
              case 3: val = id(thermostat_sensor_hvac_action_3).state; break;
              case 4: val = id(thermostat_sensor_hvac_action_4).state; break;
            }
            if (!val.empty()) {
              id(thermostat_sensor_hvac_action).publish_state(val);
            }
          }

          // HVAC modes
          {
            std::string val;
            switch (idx) {
              case 1: val = id(thermostat_hvac_modes_1).state; break;
              case 2: val = id(thermostat_hvac_modes_2).state; break;
              case 3: val = id(thermostat_hvac_modes_3).state; break;
              case 4: val = id(thermostat_hvac_modes_4).state; break;
            }
            if (!val.empty()) {
              id(thermostat_hvac_modes).publish_state(val);
            }
          }

          // Preset modes
          {
            std::string val;
            switch (idx) {
              case 1: val = id(thermostat_preset_modes_1).state; break;
              case 2: val = id(thermostat_preset_modes_2).state; break;
              case 3: val = id(thermostat_preset_modes_3).state; break;
              case 4: val = id(thermostat_preset_modes_4).state; break;
            }
            if (!val.empty()) {
              id(thermostat_preset_modes).publish_state(val);
            }
          }

          // Current preset mode
          {
            std::string val;
            switch (idx) {
              case 1: val = id(thermostat_preset_mode_1).state; break;
              case 2: val = id(thermostat_preset_mode_2).state; break;
              case 3: val = id(thermostat_preset_mode_3).state; break;
              case 4: val = id(thermostat_preset_mode_4).state; break;
            }
            if (!val.empty()) {
              id(thermostat_preset_mode).publish_state(val);
            }
          }

          // Trigger arc range init if needed (min/max now published)
          if (!id(thermostat_arc_range_initialized)) {
            id(thermostat_update_arc_temp_range).execute();
          }

      - script.execute: thermostat_get_current_values
      - script.execute: thermostat_update_active_arc_layer
      - script.execute: thermostat_update_segments
      - script.execute: thermostat_update_mode_buttons_visibility
      - script.execute: thermostat_update_preset_buttons_visibility
      - script.execute: thermostat_update_adjust_buttons_color
      - script.execute: update_thermostat_window_display

  - id: thermostat_get_current_values
    then:
      - lambda: |-
          float current_temp = id(thermostat_sensor_current_temp).state;
          float target_temp = id(thermostat_sensor_target_temp).state;
          int m = id(thermostat_temp_step_multiplier);

          // Current temp label and arc
          char buf[8];
          snprintf(buf, sizeof(buf), "%.1f", current_temp);
          lv_label_set_text(id(thermostat_current_temperature_label), buf);
          lv_arc_set_value(id(thermostat_arc_current_temperature), (int)(current_temp * m + 0.5f));

          // Target temp label
          int scaled = (int)(target_temp * m + 0.5f);
          int whole = scaled / m;
          int frac_digit = ((scaled * 10) / m) % 10;
          char whole_buf[10], frac_buf[10];
          snprintf(whole_buf, sizeof(whole_buf), "%d", whole);
          snprintf(frac_buf, sizeof(frac_buf), ".%01d", frac_digit);
          lv_label_set_text(id(thermostat_target_temperature_whole), whole_buf);
          lv_label_set_text(id(thermostat_target_temperature_fraction), frac_buf);

  - id: thermostat_update_arc_temp_range
    then:
      - lambda: |-
          if (!id(thermostat_arc_range_initialized) &&
              id(thermostat_sensor_min_temp).has_state() &&
              id(thermostat_sensor_max_temp).has_state()) {
            int min_val = (int)id(thermostat_sensor_min_temp).state;
            int max_val = (int)id(thermostat_sensor_max_temp).state;
            int m = id(thermostat_temp_step_multiplier);
            int min_scaled = min_val * m;
            int max_scaled = max_val * m;

            // Set range for all arcs
            auto set_range = [&](lv_obj_t* arc) {
              lv_arc_set_range(arc, min_scaled, max_scaled);
            };
            set_range(id(thermostat_arc_background));
            set_range(id(thermostat_arc_current_temperature));
            set_range(id(thermostat_arc_knob));
            set_range(id(thermostat_arc_base_heat));
            set_range(id(thermostat_arc_dot_heat));
            set_range(id(thermostat_arc_knob_heat));

            id(thermostat_arc_range_initialized) = true;
          }

  - id: thermostat_update_mode_buttons_visibility
    then:
      - lambda: |-
          std::string modes = id(thermostat_hvac_modes).state;
          auto show_if_present = [&](lv_obj_t* btn, const std::string& mode) {
            if (modes.find(mode) != std::string::npos) {
              lv_obj_clear_flag(btn, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(btn, LV_OBJ_FLAG_HIDDEN);
            }
          };
          show_if_present(id(thermostat_off_mode_btn), "'off'");
          show_if_present(id(thermostat_heat_mode_btn), "'heat'");

  - id: thermostat_update_preset_buttons_visibility
    then:
      - lambda: |-
          std::string presets = id(thermostat_preset_modes).state;
          auto show_if_present = [&](lv_obj_t* btn, const std::string& preset) {
            if (presets.find(preset) != std::string::npos) {
              lv_obj_clear_flag(btn, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(btn, LV_OBJ_FLAG_HIDDEN);
            }
          };
          show_if_present(id(thermostat_eco_preset_btn), "eco");
          show_if_present(id(thermostat_away_preset_btn), "away");
          show_if_present(id(thermostat_comfort_preset_btn), "comfort");
          show_if_present(id(thermostat_home_preset_btn), "home");
          show_if_present(id(thermostat_sleep_preset_btn), "sleep");
          show_if_present(id(thermostat_activity_preset_btn), "activity");

  - id: thermostat_update_segments
    mode: restart
    then:
      - lambda: |-
          if (!id(thermostat_sensor_current_temp).has_state()) return;
          std::string mode = id(thermostat_sensor_state).state;
          int min_v = lv_arc_get_min_value(id(thermostat_arc_base_heat));
          int max_v = lv_arc_get_max_value(id(thermostat_arc_base_heat));
          if (min_v >= max_v) return;

          int mseg = id(thermostat_temp_step_multiplier);
          float current_scaled_f = id(thermostat_sensor_current_temp).state * mseg;
          current_scaled_f = std::clamp(current_scaled_f, (float)min_v, (float)max_v);
          int current_scaled = (int)current_scaled_f;

          auto angle_for_precise = [&](float v) -> int {
            float precise_angle = (v - min_v) * 180.0f / (float)(max_v - min_v);
            return (int)(precise_angle * 10.0f + 0.5f) / 10;
          };

          bool show_segment = false;
          if (mode == "heat") {
            int low_scaled = lv_arc_get_value(id(thermostat_arc_base_heat));
            show_segment = (current_scaled < low_scaled - 0.1f * mseg);
          } else {
            // For other modes, no segment
            show_segment = false;
          }

          if (show_segment) {
            lv_obj_clear_flag(id(thermostat_arc_segment_heat), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(thermostat_arc_dot_heat), LV_OBJ_FLAG_HIDDEN);
            int low_scaled = lv_arc_get_value(id(thermostat_arc_base_heat));
            float a_start = angle_for_precise((float)current_scaled);
            float a_end = angle_for_precise((float)low_scaled);
            if (a_end < a_start + 1.0f) a_end = a_start + 1.0f;
            lv_arc_set_start_angle(id(thermostat_arc_segment_heat), (int)a_start);
            lv_arc_set_end_angle(id(thermostat_arc_segment_heat), (int)a_end);
            lv_arc_set_value(id(thermostat_arc_dot_heat), current_scaled);
          } else {
            lv_obj_add_flag(id(thermostat_arc_segment_heat), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(thermostat_arc_dot_heat), LV_OBJ_FLAG_HIDDEN);
          }

  - id: thermostat_update_active_arc_layer
    then:
      - lambda: |-
          // Make heat arc clickable
          lv_obj_add_flag(id(thermostat_arc_base_heat), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_add_flag(id(thermostat_arc_base_heat), LV_OBJ_FLAG_ADV_HITTEST);

          // Bring to foreground
          lv_obj_move_foreground(id(thermostat_arc_background));
          lv_obj_move_foreground(id(thermostat_arc_current_temperature));
          lv_obj_move_foreground(id(thermostat_arc_knob));
          lv_obj_move_foreground(id(thermostat_arc_base_heat));
          lv_obj_move_foreground(id(thermostat_arc_segment_heat));
          lv_obj_move_foreground(id(thermostat_arc_dot_heat));
          lv_obj_move_foreground(id(thermostat_arc_knob_heat));

  - id: thermostat_update_adjust_buttons_color
    then:
      - lambda: |-
          std::string mode = id(thermostat_sensor_state).state;
          lv_color_t color = (mode == "heat") ? lv_color_hex(0xFF6600) : lv_color_hex(0x9BA2BC);
          lv_obj_set_style_text_color(id(thermostat_plus_label), color, 0);
          lv_obj_set_style_text_color(id(thermostat_minus_label), color, 0);