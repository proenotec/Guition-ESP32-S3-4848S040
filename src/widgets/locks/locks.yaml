script:
  - id: update_locks_doors_display
    then:
      - lambda: |-
          ESP_LOGD("locks", "Updating locks and doors display");

          // Update Main Door contact status and icon
          if (id(maindoor_contact).state) {
            lv_label_set_text(id(main_door_icon), "\U000F081C"); // mdi:door-open
            lv_obj_set_style_text_color(id(main_door_icon), lv_color_hex(0xFF0000), 0); // Red
          } else {
            lv_label_set_text(id(main_door_icon), "\U000F081B"); // mdi:door
            lv_obj_set_style_text_color(id(main_door_icon), lv_color_hex(0x00FF00), 0); // Green
          }

          // Update Back Door contact status and icon
          if (id(backdoor_contact).state) {
            lv_label_set_text(id(back_door_icon), "\U000F081C"); // mdi:door-open
            lv_obj_set_style_text_color(id(back_door_icon), lv_color_hex(0xFF0000), 0); // Red
          } else {
            lv_label_set_text(id(back_door_icon), "\U000F081B"); // mdi:door
            lv_obj_set_style_text_color(id(back_door_icon), lv_color_hex(0x00FF00), 0); // Green
          }

          // Update Main Door Lock icon and label
          std::string main_lock_state = id(maindoor_nuki_state).state;
          if (main_lock_state == "locked") {
            lv_label_set_text(id(maindoor_lock_label), "Desbloquear");
            lv_label_set_text(id(maindoor_lock_icon), "\U000F033E"); // mdi:lock
            lv_obj_set_style_text_color(id(maindoor_lock_icon), lv_color_hex(0x00FF00), 0); // Green
          } else if (main_lock_state == "unlocked") {
            lv_label_set_text(id(maindoor_lock_label), "Bloquear");
            lv_label_set_text(id(maindoor_lock_icon), "\U000F033F"); // mdi:lock-open
            lv_obj_set_style_text_color(id(maindoor_lock_icon), lv_color_hex(0xFF6600), 0); // Orange
          } else if (main_lock_state == "locking" || main_lock_state == "unlocking") {
            lv_label_set_text(id(maindoor_lock_label),
              main_lock_state == "locking" ? "Bloqueando..." : "Desbloqueando...");
            lv_label_set_text(id(maindoor_lock_icon), "\U000F05CE"); // mdi:lock-clock
            lv_obj_set_style_text_color(id(maindoor_lock_icon), lv_color_hex(0xFFFF00), 0); // Yellow
          }

          // Update Back Door Lock icon and label
          std::string back_lock_state = id(backdoor_nuki_state).state;
          if (back_lock_state == "locked") {
            lv_label_set_text(id(backdoor_lock_label), "Desbloquear");
            lv_label_set_text(id(backdoor_lock_icon), "\U000F033E"); // mdi:lock
            lv_obj_set_style_text_color(id(backdoor_lock_icon), lv_color_hex(0x00FF00), 0); // Green
          } else if (back_lock_state == "unlocked") {
            lv_label_set_text(id(backdoor_lock_label), "Bloquear");
            lv_label_set_text(id(backdoor_lock_icon), "\U000F033F"); // mdi:lock-open
            lv_obj_set_style_text_color(id(backdoor_lock_icon), lv_color_hex(0xFF6600), 0); // Orange
          } else if (back_lock_state == "locking" || back_lock_state == "unlocking") {
            lv_label_set_text(id(backdoor_lock_label),
              back_lock_state == "locking" ? "Bloqueando..." : "Desbloqueando...");
            lv_label_set_text(id(backdoor_lock_icon), "\U000F05CE"); // mdi:lock-clock
            lv_obj_set_style_text_color(id(backdoor_lock_icon), lv_color_hex(0xFFFF00), 0); // Yellow
          }

          ESP_LOGD("locks", "Display update complete");

sensor:
  - platform: template
    id: locks_door_window_subscriber
    internal: true
    # NO LAMBDA - se actualiza via publish_state()
    on_value:
      - lambda: |-
          ESP_LOGD("locks_sub", "🔔 Event received! Counter: %.0f", x);
          ESP_LOGD("locks_sub", "   Page: %s, Source: %s",
                   id(active_lvgl_page).c_str(), id(last_event_source).c_str());
      - if:
          condition:
            lambda: 'return id(active_lvgl_page) == "locks_page";'
          then:
            - logger.log: "✅ Calling update_locks_doors_display"
            - script.execute: update_locks_doors_display
          else:
            - logger.log: "⚠️ Not on locks_page, ignoring"

  - platform: homeassistant
    id: maindoor_battery
    entity_id: sensor.nuki_front_door_battery
    internal: true
    on_value:
      - lvgl.label.update:
          id: maindoor_battery_label
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Batería Main: %.0f%%", x);
            return buf;

  - platform: homeassistant
    id: backdoor_battery
    entity_id: sensor.nuki_back_door_battery
    internal: true
    on_value:
      - lvgl.label.update:
          id: backdoor_battery_label
          text: !lambda |-
            char buf[32];
            sprintf(buf, "Batería Back: %.0f%%", x);
            return buf;

# Botones para controlar las cerraduras Nuki

button:
  # Botón Lock/Unlock para puerta principal
  - platform: template
    name: "Main Door Lock/Unlock"
    id: main_door_toggle
    icon: "mdi:lock"
    on_press:
      - logger.log: "Main door toggle button pressed"
      - if:
          condition:
            lambda: 'return id(candado_activo2);'
          then:
            - logger.log: "Candado is active, checking lock state"
            - if:
                condition:
                  lambda: |-
                    return id(maindoor_nuki_state).state == "locked";
                then:
                  - logger.log: "Unlocking main door"
                  - homeassistant.service:
                      service: lock.unlock
                      data:
                        entity_id: lock.nuki_front_door
                  - lvgl.label.update:
                      id: status_msg2
                      text: "Desbloqueando puerta principal"
                else:
                  # Check if door is closed before locking
                  - if:
                      condition:
                        lambda: 'return id(maindoor_contact).state;'  # true = open
                      then:
                        - logger.log: "Cannot lock - door is OPEN"
                        - lvgl.label.update:
                            id: status_msg2
                            text: "ATENCION: No se puede bloquear - puerta abierta"
                            text_color: 0xFF0000
                        # Start blinking animation
                        - delay: 100ms
                        - lvgl.widget.update:
                            id: status_msg2
                            opa: 0%           # ← corrected property name + percent sign
                        - repeat:
                            count: 6
                            then:
                              - lvgl.widget.update:
                                  id: status_msg2
                                  opa: 100%
                              - delay: 400ms
                              - lvgl.widget.update:
                                  id: status_msg2
                                  opa: 0%
                              - delay: 400ms
                        # Optional: make sure it's fully visible again at the end
                        - lvgl.widget.update:
                            id: status_msg2
                            opa: 100%
                        - delay: 2s
                        - lvgl.label.update:
                            id: status_msg2
                            text: "Desliza para quitar candado"
                            text_color: 0x0000FF
                      else:
                        - logger.log: "Locking main door"
                        - homeassistant.service:
                            service: lock.lock
                            data:
                              entity_id: lock.nuki_front_door
                        - lvgl.label.update:
                            id: status_msg2
                            text: "Bloqueando puerta principal"
          else:
            - logger.log: "Candado is NOT active"
            - lvgl.label.update:
                id: status_msg2
                text: "Candado inactivo - desliza para activar"

  # Botón Unlatch para puerta principal
  - platform: template
    name: "Main Door Unlatch"
    id: main_door_unlatch
    icon: "mdi:door-open"
    on_press:
      - logger.log: "Main door unlatch button pressed"
      - if:
          condition:
            lambda: 'return id(candado_activo2);'
          then:
            - logger.log: "Opening main door latch"
            - homeassistant.service:
                service: lock.open
                data:
                  entity_id: lock.nuki_front_door
            - lvgl.label.update:
                id: status_msg2
                text: "Abriendo pestillo puerta principal"
          else:
            - logger.log: "Candado is NOT active"
            - lvgl.label.update:
                id: status_msg2
                text: "Candado inactivo - desliza para activar"

  # Botón Lock/Unlock para puerta trasera
  - platform: template
    name: "Back Door Lock/Unlock"
    id: back_door_toggle
    icon: "mdi:lock"
    on_press:
      - logger.log: "Back door toggle button pressed"
      - if:
          condition:
            lambda: 'return id(candado_activo2);'
          then:
            - logger.log: "Candado is active, checking lock state"
            - if:
                condition:
                  lambda: |-
                    return id(backdoor_nuki_state).state == "locked";
                then:
                  - logger.log: "Unlocking back door"
                  - homeassistant.service:
                      service: lock.unlock
                      data:
                        entity_id: lock.nuki_back_door
                  - lvgl.label.update:
                      id: status_msg2
                      text: "Desbloqueando puerta trasera"
                else:
                  # Check if door is closed before locking
                  - if:
                      condition:
                        lambda: 'return id(backdoor_contact).state;'  # true = open
                      then:
                        - logger.log: "Cannot lock - door is OPEN"
                        - lvgl.label.update:
                            id: status_msg2
                            text: "ATENCION: No se puede bloquear - puerta abierta"
                            text_color: 0xFF0000
                        # Start blinking animation
                        - delay: 100ms
                        - lvgl.widget.update:
                            id: status_msg2
                            opa: 0%           # ← corrected property name + percent sign
                        - repeat:
                            count: 6
                            then:
                              - lvgl.widget.update:
                                  id: status_msg2
                                  opa: 100%
                              - delay: 400ms
                              - lvgl.widget.update:
                                  id: status_msg2
                                  opa: 0%
                              - delay: 400ms
                        # Optional: make sure it's fully visible again at the end
                        - lvgl.widget.update:
                            id: status_msg2
                            opa: 100%
                        - delay: 2s
                        - lvgl.label.update:
                            id: status_msg2
                            text: "Desliza para quitar candado"
                            text_color: 0x0000FF
                      else:
                        - logger.log: "Locking back door"
                        - homeassistant.service:
                            service: lock.lock
                            data:
                              entity_id: lock.nuki_back_door
                        - lvgl.label.update:
                            id: status_msg2
                            text: "Bloqueando puerta trasera"
          else:
            - logger.log: "Candado is NOT active"
            - lvgl.label.update:
                id: status_msg2
                text: "Candado inactivo - desliza para activar"

# Número que actúa como slider de candado

number:
  - platform: template
    name: "Permite Candado2"
    id: progress_value2
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    initial_value: 0
    restore_value: false
    on_value:
      then:
        # Actualizar la posición del slider SOLO si no viene del slider
        - if:
            condition:
              lambda: 'return !id(updating_progress2);'
            then:
              - lambda: 'id(updating_progress2) = true;'
              - lvgl.slider.update:
                  id: progress_slider2
                  value: !lambda 'return x;'
              - lambda: 'id(updating_progress2) = false;'
        # Actualizar el label del porcentaje
        - lvgl.label.update:
            id: progress_label2
            text: !lambda |-
              char buf[32];
              sprintf(buf, "%.0f%%", x);
              return buf;
        # Activar candado SOLO cuando llega exactamente a 100
        - if:
            condition:
              lambda: 'return x >= 100;'
            then:
              - logger.log: "Activating candado - enabling buttons"
              - lambda: 'id(candado_activo2) = true;'
              - lvgl.label.update:
                  id: lock_status
                  text: "CANDADO ACTIVO"
                  text_color: 0x00FF00
              # HABILITAR BOTONES
              - lvgl.widget.update:
                  id: md_lock_unlock_btn
                  state:
                    disabled: false
              - lvgl.widget.update:
                  id: md_unlatch_btn
                  state:
                    disabled: false
              - lvgl.widget.update:
                  id: bd_lock_unlock_btn
                  state:
                    disabled: false
        # Desactivar candado SOLO cuando llega a 0
        - if:
            condition:
              lambda: 'return x <= 0;'
            then:
              - logger.log: "Deactivating candado - disabling buttons"
              - lambda: 'id(candado_activo2) = false;'
              - lvgl.label.update:
                  id: lock_status
                  text: "CANDADO INACTIVO"
                  text_color: 0xFF0000
              # DESHABILITAR BOTONES
              - lvgl.widget.update:
                  id: md_lock_unlock_btn
                  state:
                    disabled: true
              - lvgl.widget.update:
                  id: md_unlatch_btn
                  state:
                    disabled: true
              - lvgl.widget.update:
                  id: bd_lock_unlock_btn
                  state:
                    disabled: true

# Intervalo para decrementar automáticamente

interval:
  - interval: 1s
    then:
      - if:
          condition:
            - lambda: 'return id(active_lvgl_page) == "locks_page";'
            - lambda: 'return id(candado_activo2);' # Solo si el candado está activo
          then:
            - lambda: |-
                if (id(progress_value2).state >= 100) {
                  delay(500);
                }

                if (id(progress_value2).state > 0) {
                  float new_value = id(progress_value2).state - 10;
                  if (new_value < 0) {
                    new_value = 0;
                  }
                  id(progress_value2).publish_state(new_value);
                }

lvgl:
  pages:
    - id: locks_page
      on_load:
        # ✅ Método centralizado
        - script.execute:
            id: set_active_page
            page_name: "locks_page"
        # ✅ Actualizar display al cargar la página
        - script.execute: update_locks_doors_display
      widgets:
        # === SECCIÓN SLIDER DE CANDADO ===
        - obj:
            width: 100%
            height: 100
            y: 5
            pad_all: 8
            widgets:
              # - label:
              #     align: TOP_MID
              #     y: 5
              #     text: "Nuki Control"
              #     text_font: nunito_24
              #     text_color: 0

              - slider:
                  id: progress_slider2
                  align: CENTER
                  y: 5
                  width: 80%
                  height: 35
                  min_value: 0
                  max_value: 100
                  value: 0
                  pad_all: 8
                  bg_color: 0x333333
                  indicator:
                    bg_color: 0x00FF00
                    bg_grad_color: 0xFFFF00
                    bg_grad_dir: HOR
                  knob:
                    bg_color: 0x2F8CD8
                    radius: 15
                    width: 30
                    height: 30
                  on_value:
                    then:
                      - lambda: |-
                          if (!id(updating_progress2)) {
                            id(updating_progress2) = true;
                            id(progress_value2).publish_state(x);
                            id(updating_progress2) = false;
                          }

              - label:
                  id: progress_label2
                  align: BOTTOM_MID
                  y: -20
                  text: "0%"
                  text_font: nunito_16

              - label:
                  id: lock_status
                  align: TOP_RIGHT
                  x: -10
                  y: 5
                  text: "CANDADO INACTIVO"
                  text_font: nunito_14
                  text_color: 0xFF0000

        # === SECCIÓN BOTONES DE CONTROL DE CERRADURAS ===
        - obj:
            width: 100%
            height: 260
            y: 110
            pad_all: 8
            widgets:
              # Título Puerta Principal
              - label:
                  align: TOP_MID
                  y: 0
                  text: "PUERTA PRINCIPAL"
                  text_font: nunito_16
                  text_color: 0

              # Botón Main Door Lock/Unlock
              - button:
                  id: md_lock_unlock_btn
                  align: TOP_LEFT
                  x: 10
                  y: 25
                  width: 45%
                  height: 70
                  checkable: false
                  state:
                    disabled: true
                  bg_color: 0x0000FF
                  widgets:
                    - label:
                        id: maindoor_lock_icon
                        align: TOP_MID
                        y: 5
                        text: "\U000F033E"
                        text_font: mdi_icons_32
                        text_color: 0x00FF00
                    - label:
                        id: maindoor_lock_label
                        align: BOTTOM_MID
                        y: -5
                        text: "xxx"
                        text_font: nunito_14
                    - label:
                        id: main_door_icon
                        align: RIGHT_MID
                        x: 0
                        text: "\U000F081C"
                        text_font: mdi_icons_32
                        text_color: 0xFF0000
                  on_press:
                    - button.press: main_door_toggle

              # Botón Main Door Unlatch
              - button:
                  id: md_unlatch_btn
                  align: TOP_RIGHT
                  x: -10
                  y: 25
                  width: 45%
                  height: 70
                  checkable: false
                  state:
                    disabled: true
                  bg_color: 0x00AA00
                  widgets:
                    - label:
                        align: TOP_MID
                        y: 5
                        text: "\U000F033E"
                        text_font: mdi_icons_32
                        text_color: 0xFFFFFF
                    - label:
                        align: BOTTOM_MID
                        y: -5
                        text: "Unlatch"
                        text_font: nunito_14
                  on_press:
                    - button.press: main_door_unlatch

              # Título Puerta Trasera
              - label:
                  align: CENTER
                  y: 10
                  text: "PUERTA TRASERA"
                  text_font: nunito_16
                  text_color: 0

              # Botón Back Door Lock/Unlock
              - button:
                  id: bd_lock_unlock_btn
                  align: CENTER
                  y: 60
                  width: 90%
                  height: 70
                  checkable: false
                  state:
                    disabled: true
                  bg_color: 0x0000FF
                  widgets:
                    - label:
                        id: backdoor_lock_icon
                        align: LEFT_MID
                        x: 20
                        text: "\U000F033E"
                        text_font: mdi_icons_32
                        text_color: 0x00FF00
                    - label:
                        id: backdoor_lock_label
                        align: CENTER
                        text: "xxx"
                        text_font: nunito_18
                    - label:
                        id: back_door_icon
                        align: RIGHT_MID
                        x: 0
                        text: "\U000F081C"
                        text_font: mdi_icons_32
                        text_color: 0xFF0000
                  on_press:
                    - button.press: back_door_toggle

        # Mensaje de estado
        - obj:
            width: 100%
            height: 50
            y: 375
            pad_all: 8
            widgets:
              - label:
                  id: status_msg2
                  align: CENTER
                  text: "Desliza para quitar candado"
                  text_font: nunito_18
                  text_color: 0x0000FF

        # === SECCIÓN SENSORES ===
        - obj:
            width: 100%
            height: 40
            y: 430
            pad_all: 8
            widgets:
              - label:
                  id: maindoor_battery_label
                  align: LEFT_MID
                  x: 10
                  text: "Batería Main: --"
                  text_font: nunito_12

              - label:
                  id: backdoor_battery_label
                  align: RIGHT_MID
                  x: -10
                  text: "Batería Back: --"
                  text_font: nunito_12

        # === BOTÓN BACK ===
        - obj:
            y: 0
            width: 80
            height: 50
            align: bottom_mid
            bg_opa: transp
            pad_all: 0
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 0
            widgets:
              - obj:
                  y: -20
                  width: 80
                  height: 5
                  align: bottom_mid
                  bg_color: color_steel_blue
                  pad_all: 0
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  radius: 15
            on_click:
              - script.execute:
                  id: page_cleanup
                  page_name: "locks_page"
              - lvgl.page.show: home_page
