# Variables globales

globals:
  - id: updating_progress2
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: candado_activo2
    type: bool
    restore_value: yes
    initial_value: 'false'

# Sensores desde Home Assistant

binary_sensor:
  - platform: homeassistant
    id: maindoor_contact
    entity_id: binary_sensor.maindoor_contact
    internal: true
    on_state:
      - logger.log:
          format: "Main door contact changed: %d"
          args: [ 'x' ]
      - script.execute:
          id: publish_event
          event_type: "door_window"
          source: "maindoor_contact"

  - platform: homeassistant
    id: backdoor_contact
    entity_id: binary_sensor.backdoor_opening
    internal: true
    on_state:
      - logger.log:
          format: "Back door contact changed: %d"
          args: [ 'x' ]
      - script.execute:
          id: publish_event
          event_type: "door_window"
          source: "backdoor_contact"

text_sensor:
  - platform: homeassistant
    id: maindoor_nuki_state
    entity_id: lock.nuki_front_door
    internal: true
    on_value:
      - logger.log:
          format: "Main door Nuki state changed to: %s"
          args: [ 'x.c_str()' ]
      - script.execute:
          id: publish_event
          event_type: "door_window"
          source: "maindoor_nuki"

  - platform: homeassistant
    id: backdoor_nuki_state
    entity_id: lock.nuki_back_door
    internal: true
    on_value:
      - logger.log:
          format: "Back door Nuki state changed to: %s"
          args: [ 'x.c_str()' ]
      - script.execute:
          id: publish_event
          event_type: "door_window"
          source: "backdoor_nuki"

  - platform: homeassistant
    id: maindoor_last_seen
    entity_id: sensor.maindoor_last_seen
    internal: true

