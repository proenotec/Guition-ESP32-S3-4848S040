# ============================================================
# common/page_manager.yaml (OPCIONAL - Mejora arquitectónica)
# ============================================================
# Este sistema centraliza el cambio de páginas y facilita:
# - Logging consistente
# - Acciones al salir de una página
# - Acciones al entrar en una página
# - Hooks para cleanup/init
# ============================================================

globals:
  - id: active_lvgl_page
    type: std::string
    restore_value: false
    initial_value: '"home_page"'

  - id: previous_lvgl_page
    type: std::string
    restore_value: false
    initial_value: '""'

script:
  # ============================================================
  # Script para cambiar de página de forma centralizada
  # ============================================================
  - id: set_active_page
    parameters:
      page_name: string
    then:
      - lambda: |-
          // Guardar página anterior para historial
          id(previous_lvgl_page) = id(active_lvgl_page);

          // Actualizar página activa
          id(active_lvgl_page) = page_name;

          ESP_LOGD("PageManager", "Page changed: %s → %s",
                   id(previous_lvgl_page).c_str(),
                   id(active_lvgl_page).c_str());

  # ============================================================
  # Script para cleanup al salir de una página
  # ============================================================
  - id: page_cleanup
    parameters:
      page_name: string
    then:
      - lambda: |-
          ESP_LOGD("PageManager", "Cleanup for page: %s", page_name.c_str());
          ESP_LOGD("PageManager", "previous_lvgl_page: %s", id(previous_lvgl_page).c_str());
          ESP_LOGD("PageManager", "active_lvgl_page: %s", id(active_lvgl_page).c_str());

          // Detener scripts específicos de cada página
          if ((page_name == "texto_page") || (id(active_lvgl_page) == "texto_page")) {
            if (id(cycle_texto_page_climates).is_running()) {
              id(cycle_texto_page_climates).stop();
            }
          }
          // Ocultar widget de luz si salimos de light_control_page
          else if ((page_name == "light_control_page") || (id(active_lvgl_page) == "light_control_page")) {
            auto widget = id(light_select_widget);
            if (widget != nullptr) {
              lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
            }
          }
          // Ocultar widget de persianas si salimos de cover_page
          else if ((page_name == "cover_page") || (id(active_lvgl_page) == "cover_page")) {
            auto widget = id(cover_select_widget);
            if (widget != nullptr) {
              lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
            }
          }
          // Ocultar widget de termostatos si salimos de therm_page
          else if ((page_name == "therm_page") || (id(active_lvgl_page) == "therm_page")) {
            auto widget = id(thermo_select_widget);
            if (widget != nullptr) {
              lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
            }
          }
          // Ocultar widget de ventiladores si salimos de fan_page
          else if ((page_name == "fan_page") || (id(active_lvgl_page) == "fan_page")) {
            auto widget = id(fan_select_widget);
            if (widget != nullptr) {
              lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
            }
          }

          // Añadir más cleanups según necesites
