# common/widgets/devices.yaml

lvgl:
  pages:
    - id: devices_page
      bg_color: color_black
      widgets:
        # Title label
        - label:
            id: devices_title
            x: 10
            y: 10
            text: "Select Widget"
            text_font: nunito_20
            text_color: color_misty_blue

        # The roller: Full-width selector for widgets
        - roller:
            id: widget_roller
            x: 20
            y: 80
            width: 440
            height: 360
            align: top_left
            options: !include devices_list.yaml
            selected_index: 0
            # Styling
            bg_color: color_steel_blue
            border_color: color_misty_blue
            border_width: 2
            text_font: nunito_36
            # Event: On value change, navigate to the page
            on_value: !include devices_handler.yaml

        # BACK button
        - obj:
            y: 0
            width: 80
            height: 50
            align: bottom_mid
            bg_opa: transp
            pad_all: 0
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 0
            widgets:
              - obj:
                  y: -20
                  width: 80
                  height: 5
                  align: bottom_mid
                  bg_color: color_steel_blue
                  pad_all: 0
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  radius: 15
            on_click:
              - lvgl.page.show: home_page