# common/widgets/devices.yaml

lvgl:
  pages:
    - id: devices_page
      bg_color: color_black
      on_load:
        # ✅ Método centralizado
        - script.execute:
            id: set_active_page
            page_name: "devices_page"
      widgets:
        # Title label
        - label:
            id: devices_title
            x: 10
            y: 10
            text: "Select Widget"
            text_font: nunito_20
            text_color: color_misty_blue

        # Button matrix selector (auto-generated from config)
        - buttonmatrix:
            id: widget_buttons
            x: 20
            y: 80
            width: 440
            height: 310
            align: top_left
            bg_color: color_steel_blue
            border_color: color_misty_blue
            border_width: 4
            outline_width: 0
            pad_all: 4
            rows: !include devices_list.yaml
            items:
              bg_color: color_steel_blue
              text_font: nunito_20
              text_color: color_misty_blue
              pressed:
                bg_color: 0x4169E1
            on_press: !include devices_handler.yaml

        # BACK button
        - obj:
            y: 0
            width: 80
            height: 50
            align: bottom_mid
            bg_opa: transp
            pad_all: 0
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 0
            widgets:
              - obj:
                  y: -20
                  width: 80
                  height: 5
                  align: bottom_mid
                  bg_color: color_steel_blue
                  pad_all: 0
                  border_opa: transp
                  border_width: 0
                  shadow_opa: transp
                  radius: 15
            on_click:
              - script.execute:
                  id: page_cleanup
                  page_name: "devices_page"
              - lvgl.page.show: home_page
